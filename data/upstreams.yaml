# Upstream registry for the OINK page annotation.
#
# Each component tree names one entry through `upstream_source` in its
# `_index.md` cascade; every page inside the tree then adds only the one
# per-page fact, `upstream_link`, and the annotation renders the credit,
# the copyright, the licence, and the link to the full notice.
#
# `license` is an SPDX identifier resolved through OINK's `data/licenses`
# table. `notice` points at the site attribution page, which carries the
# pinned snapshot identity, the retained upstream licence texts, and the
# obligations a one-line credit cannot state.

