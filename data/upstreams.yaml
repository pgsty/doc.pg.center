  name: Patroni documentation
  repository: https://github.com/patroni/patroni
  documentation: https://patroni.readthedocs.io/en/latest/
  source_ref: v4.1.5
  copyright: Copyright (c) 2025 Compose, Zalando SE, Patroni Contributors
  license: MIT
  notice: /attribution/#patroni
  ref: v4.1.5
  modified: true

