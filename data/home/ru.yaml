# doc.pg.center home (ru): hero with the eight reading languages, the six
# manuals with their most-used pages, and two facts about the site. Partials
# live in layouts/_partials/pgsql/. Keep the eight language files in step.
sections:
  - { key: hero, partial: pgsql/hero-orbit.html }
  - { key: components, partial: pgsql/manuals.html }
  - { key: about, partial: pgsql/about.html }

hero:
  class: pgsql-hero pgsql-hero--fit-title
  title_lines:
    - words:
        - { mark: "P", color: "blue", text: "ostgreSQL" }
    - words:
        - { text: "Документация компонентов" }
  lead: "Руководства и справочники по инструментам для эксплуатации PostgreSQL."
  note: "Шесть компонентов, восемь языков. Документация от [pg.center](https://pg.center/)."
  note_icon: fa-solid fa-book-open
  languages_label: "Читать на"
  orbit:
    center_image: img/slonik.svg

components:
  title: "Компоненты сообщества"
  items:
    - title: "Patroni"
      meta: "Высокая доступность"
      version: v4.1.5
      icon: fa-solid fa-heart-pulse
      desc: "Высокодоступные кластеры PostgreSQL с автоматическим переключением при сбое."
      url: /patroni/
      shortcuts_label: "Быстрые ссылки на документацию Patroni"
      shortcuts:
        - { title: "Установка", url: /patroni/installation/, icon: fa-solid fa-download }
        - { title: "Настройка", url: /patroni/config/, icon: fa-solid fa-sliders }
        - { title: "patronictl", url: /patroni/patronictl/, icon: fa-solid fa-terminal }
        - { title: "REST API", url: /patroni/rest_api/, icon: fa-solid fa-plug }
    - title: "pgBackRest"
      meta: "Резервное копирование и восстановление"
      version: v2.60.0
      icon: fa-solid fa-couch
      desc: "Надёжное резервное копирование, архивация и восстановление на момент времени."
      url: /pgbackrest/
      shortcuts_label: "Быстрые ссылки на документацию pgBackRest"
      shortcuts:
        - { title: "Руководство пользователя", url: /pgbackrest/user-guide/, icon: fa-solid fa-route }
        - { title: "Настройка", url: /pgbackrest/configuration/, icon: fa-solid fa-sliders }
        - { title: "Команды", url: /pgbackrest/command/, icon: fa-solid fa-terminal }
        - { title: "Частые вопросы", url: /pgbackrest/faq/, icon: fa-solid fa-circle-question }
    - title: "PgBouncer"
      meta: "Пул соединений"
      version: v1.26.1
      icon: fa-solid fa-arrows-turn-to-dots
      desc: "Меньше накладных расходов на соединения: пулы сеансов, транзакций и операторов."
      url: /pgbouncer/
      shortcuts_label: "Быстрые ссылки на документацию PgBouncer"
      shortcuts:
        - { title: "Установка", url: /pgbouncer/install/, icon: fa-solid fa-wrench }
        - { title: "Использование", url: /pgbouncer/usage/, icon: fa-solid fa-terminal }
        - { title: "Настройка", url: /pgbouncer/config/, icon: fa-solid fa-sliders }
        - { title: "Частые вопросы", url: /pgbouncer/faq/, icon: fa-solid fa-circle-question }
    - title: "pgBadger"
      meta: "Анализ журналов"
      version: v13.2-dev
      icon: fa-solid fa-otter
      desc: "Отчёты о запросах, нагрузке и ошибках по журналам PostgreSQL и PgBouncer."
      url: /pgbadger/
      shortcuts_label: "Быстрые ссылки на документацию pgBadger"
      shortcuts:
        - { title: "Журналирование PostgreSQL", url: /pgbadger/postgresql-logging/, icon: fa-solid fa-file-lines }
        - { title: "Командная строка", url: /pgbadger/command-line/, icon: fa-solid fa-terminal }
        - { title: "Инкрементальные отчёты", url: /pgbadger/incremental-reports/, icon: fa-solid fa-calendar-days }
        - { title: "Примеры отчётов", url: /pgbadger/sample-reports/, icon: fa-solid fa-chart-column }
    - title: "HAProxy"
      meta: "Балансировка нагрузки"
      version: v3.4
      icon: fa-solid fa-network-wired
      desc: "Полные начальное, конфигурационное и эксплуатационное руководства по HAProxy 3.4."
      url: /haproxy/
      shortcuts_label: "Быстрые ссылки на документацию HAProxy"
      shortcuts:
        - { title: "Начальное руководство", url: /haproxy/load-balancing/, icon: fa-solid fa-compass }
        - { title: "Руководство по конфигурации", url: /haproxy/http-fundamentals/, icon: fa-solid fa-file-code }
        - { title: "Руководство по эксплуатации", url: /haproxy/prerequisites/, icon: fa-solid fa-screwdriver-wrench }
        - { title: "ACL и образцы", url: /haproxy/acls-and-samples/, icon: fa-solid fa-filter }
    - title: "etcd"
      meta: "Консенсус и координация"
      version: v3.7.3
      icon: fa-solid fa-gear
      desc: "Хранилище ключ-значение со строгой согласованностью, его API и модель Raft."
      url: /etcd/
      shortcuts_label: "Быстрые ссылки на документацию etcd"
      shortcuts:
        - { title: "Быстрый старт", url: /etcd/quickstart/, icon: fa-solid fa-bolt }
        - { title: "Установка", url: /etcd/install/, icon: fa-solid fa-download }
        - { title: "Настройка", url: /etcd/op-guide/configuration/, icon: fa-solid fa-sliders }
        - { title: "API", url: /etcd/learning/api/, icon: fa-solid fa-code }

about:
  title: "Об этом сайте"
  items:
    - title: "Независимое издание сообщества"
      text: "PG.CENTER поддерживает PGSTY; это не официальный сайт PostgreSQL. Каждый сборник ссылается на исходный проект и сохраняет сведения об авторах и лицензии."
      icon: fa-solid fa-people-group
      url: https://pg.center/
    - title: "Источники и лицензии"
      text: "В конце каждой страницы указаны исходная работа, правообладатель и лицензия. На странице атрибуции собраны зафиксированные версии исходной документации и сохранённые уведомления."
      icon: fa-solid fa-scale-balanced
      url: /attribution/
