# doc.pg.center home (en): hero with the eight reading languages, six tool
# manuals with their most-used pages, PostgreSQL and eleven kernel collections, and
# two facts about the site. Partials live in layouts/_partials/pgsql/. Keep the
# eight language files in step.
sections:
  - { key: hero, partial: pgsql/hero-orbit.html }
  - { key: kernels, partial: pgsql/manuals.html }
  - { key: components, partial: pgsql/manuals.html }
  - { key: about, partial: pgsql/about.html }

hero:
  class: pgsql-hero pgsql-hero--fit-title
  title_lines:
    - words:
        - { mark: "P", color: "blue", text: "ostgreSQL" }
    - words:
        - { text: "Component documentation" }
  lead: "Guides and references for PostgreSQL tools and database variants."
  note: "Six tools in eight languages; eleven database collections in English and Chinese. Part of [pg.center](https://pg.center/)."
  note_icon: fa-solid fa-book-open
  languages_label: "Read in"
  orbit:
    center_image: img/slonik.svg

components:
  title: "Community Components"
  items:
    - title: "Patroni"
      meta: "High availability"
      version: v4.1.5
      icon: fa-solid fa-heart-pulse
      desc: "Run PostgreSQL clusters with distributed consensus and automatic failover."
      url: /patroni/
      shortcuts_label: "Patroni documentation shortcuts"
      shortcuts:
        - { title: "Installation", url: /patroni/installation/, icon: fa-solid fa-download }
        - { title: "Configuration", url: /patroni/config/, icon: fa-solid fa-sliders }
        - { title: "patronictl", url: /patroni/patronictl/, icon: fa-solid fa-terminal }
        - { title: "REST API", url: /patroni/rest_api/, icon: fa-solid fa-plug }
    - title: "pgBackRest"
      meta: "Backup & recovery"
      version: v2.60.0
      icon: fa-solid fa-couch
      desc: "Design reliable backup, restore, archive, and point-in-time recovery workflows."
      url: /pgbackrest/
      shortcuts_label: "pgBackRest documentation shortcuts"
      shortcuts:
        - { title: "User guide", url: /pgbackrest/user-guide/, icon: fa-solid fa-route }
        - { title: "Configuration", url: /pgbackrest/configuration/, icon: fa-solid fa-sliders }
        - { title: "Commands", url: /pgbackrest/command/, icon: fa-solid fa-terminal }
        - { title: "FAQ", url: /pgbackrest/faq/, icon: fa-solid fa-circle-question }
    - title: "PgBouncer"
      meta: "Connection pooling"
      version: v1.26.1
      icon: fa-solid fa-arrows-turn-to-dots
      desc: "Cut connection overhead with session, transaction, and statement pooling."
      url: /pgbouncer/
      shortcuts_label: "PgBouncer documentation shortcuts"
      shortcuts:
        - { title: "Installation", url: /pgbouncer/install/, icon: fa-solid fa-wrench }
        - { title: "Usage", url: /pgbouncer/usage/, icon: fa-solid fa-terminal }
        - { title: "Configuration", url: /pgbouncer/config/, icon: fa-solid fa-sliders }
        - { title: "FAQ", url: /pgbouncer/faq/, icon: fa-solid fa-circle-question }
    - title: "pgBadger"
      meta: "Log analysis"
      version: v13.2-dev
      icon: fa-solid fa-otter
      desc: "Turn PostgreSQL and PgBouncer logs into query, workload, and error reports."
      url: /pgbadger/
      shortcuts_label: "pgBadger documentation shortcuts"
      shortcuts:
        - { title: "PostgreSQL logging", url: /pgbadger/postgresql-logging/, icon: fa-solid fa-file-lines }
        - { title: "Command line", url: /pgbadger/command-line/, icon: fa-solid fa-terminal }
        - { title: "Incremental reports", url: /pgbadger/incremental-reports/, icon: fa-solid fa-calendar-days }
        - { title: "Sample reports", url: /pgbadger/sample-reports/, icon: fa-solid fa-chart-column }
    - title: "HAProxy"
      meta: "Load balancing"
      version: v3.4
      icon: fa-solid fa-network-wired
      desc: "Read the complete HAProxy 3.4 Starter, Configuration, and Management manuals."
      url: /haproxy/
      shortcuts_label: "HAProxy documentation shortcuts"
      shortcuts:
        - { title: "Starter Guide", url: /haproxy/load-balancing/, icon: fa-solid fa-compass }
        - { title: "Configuration Manual", url: /haproxy/http-fundamentals/, icon: fa-solid fa-file-code }
        - { title: "Management Guide", url: /haproxy/prerequisites/, icon: fa-solid fa-screwdriver-wrench }
        - { title: "ACLs & samples", url: /haproxy/acls-and-samples/, icon: fa-solid fa-filter }
    - title: "etcd"
      meta: "Consensus & coordination"
      version: v3.7.3
      icon: fa-solid fa-gear
      desc: "Operate a strongly consistent key-value store, its APIs, Raft model, and internals."
      url: /etcd/
      shortcuts_label: "etcd documentation shortcuts"
      shortcuts:
        - { title: "Quickstart", url: /etcd/quickstart/, icon: fa-solid fa-bolt }
        - { title: "Install", url: /etcd/install/, icon: fa-solid fa-download }
        - { title: "Configuration", url: /etcd/op-guide/configuration/, icon: fa-solid fa-sliders }
        - { title: "API", url: /etcd/learning/api/, icon: fa-solid fa-code }

kernels:
  class: pgsql-manuals--kernels
  legacy_id: databases
  title: PostgreSQL Kernels
  desc: PostgreSQL manuals and eleven kernel collections, with English and Chinese editions.
  items:
  - title: PostgreSQL
    meta: The PostgreSQL core
    version: '18.6'
    icon: pgsql-icon-postgresql
    desc: Read the supported releases, preview PostgreSQL 19, or browse the historical manuals.
    url: /postgresql/
    shortcuts_label: PostgreSQL documentation shortcuts
    shortcuts:
    - title: Current manual · 18.6
      url: https://pg.center/docs/18/index.html
      icon: fa-solid fa-book-open
    - title: Supported versions
      url: /postgresql/#supported
      icon: fa-solid fa-layer-group
    - title: PostgreSQL 19 preview
      url: /postgresql/#development
      icon: fa-solid fa-flask
    - title: Historical versions
      url: /postgresql/#historical
      icon: fa-solid fa-clock-rotate-left
  - title: Citus
    meta: Distributed PostgreSQL
    version: '14'
    icon: fa-solid fa-table-cells-large
    desc: Scale PostgreSQL with sharding, parallel queries, colocation, and distributed tables.
    url: /citus/
    shortcuts_label: Citus documentation shortcuts
    shortcuts:
    - title: Get started
      url: /citus/installation/getting-started/
      icon: fa-solid fa-rocket
    - title: Data modeling
      url: /citus/modeling/data-modeling/
      icon: fa-solid fa-table-cells-large
    - title: SQL and APIs
      url: /citus/reference/
      icon: fa-solid fa-code
    - title: Articles
      url: /citus/articles/
      icon: fa-solid fa-newspaper

  - title: DocumentDB
    meta: Document database
    version: '1.0'
    icon: fa-solid fa-file-code
    desc: Store BSON documents, query and index them, and connect through a MongoDB gateway.
    url: /documentdb/
    shortcuts_label: DocumentDB documentation shortcuts
    shortcuts:
    - title: Quick start
      url: /documentdb/getting-started/
      icon: fa-solid fa-book-open
    - title: Reference
