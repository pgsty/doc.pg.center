sections:
  - key: hero
    partial: pgsql/hero-orbit.html
  - type: cards
    key: components
  - key: capabilities
    partial: pgsql/capabilities.html
  - faq

hero:
  class: pgsql-hero pgsql-hero--fit-title
  eyebrow: "PG.CENTER / Component documentation"
  title_lines:
    - words:
        - { mark: P, color: blue, text: ostgreSQL }
    - words:
        - { text: "Component documentation" }
  lead: "Guides and references for the tools that keep PostgreSQL running."
  note: "Six components, six languages. Part of [pg.center](https://pg.center/)."
  note_icon: fa-solid fa-book-open
  links_label: Component documentation
  orbit:
    center_image: img/slonik.svg

components:
  class: pgsql-components
  eyebrow: "Documentation"
  title: "Find the right manual"
  text: "Every collection is available in English, Simplified Chinese, French, Japanese, German, and Russian."
  columns: 3
  link_label: Read the docs
  items:
    - title: Patroni
      meta: High availability
      icon: fa-solid fa-heart-pulse
      desc: Run PostgreSQL clusters with distributed consensus and automatic failover.
      url: /patroni/
    - title: pgBackRest
      meta: Backup & recovery
      icon: fa-solid fa-couch
      desc: Design reliable backup, restore, archive, and point-in-time recovery workflows.
      url: /pgbackrest/
    - title: PgBouncer
      meta: Connection pooling
      icon: fa-solid fa-arrows-turn-to-dots
      desc: Cut connection overhead with session, transaction, and statement pooling.
      url: /pgbouncer/
    - title: pgBadger
      meta: Log analysis
      icon: fa-solid fa-otter
      desc: Turn PostgreSQL and PgBouncer logs into query, workload, and error reports.
      url: /pgbadger/
    - title: HAProxy
      meta: Load balancing
      icon: fa-solid fa-network-wired
      desc: Read the complete HAProxy 3.4 Starter, Configuration, and Management manuals.
      url: /haproxy/
    - title: etcd
      meta: Consensus & coordination
      icon: fa-solid fa-gear
      desc: Operate a strongly consistent key-value store, its APIs, Raft model, and internals.
      url: /etcd/

capabilities:
  eyebrow: Component guides
  title: What each component does — and where to start
  text: Read the short orientation, then use the linked index beside it to jump directly into the manual.
  items:
    - ref: 01 / HIGH AVAILABILITY
      title: Patroni
      url: /patroni/
      motto: A template for PostgreSQL high availability
      bullets:
        - Runs leader election and cluster state through a DCS.
        - Automates failover, with controls for planned changes.
        - Covers bare metal, VMs, Kubernetes, and multi-datacenter.
      value: Start with installation and configuration, then the operational surfaces.
      visual:
        type: components
        compact: true
        columns: 2
        aria_label: Patroni documentation shortcuts
        items:
          - { icon: fa-solid fa-download, title: Installation, url: /patroni/installation/ }
          - { icon: fa-solid fa-sliders, title: Configuration, url: /patroni/config/ }
          - { icon: fa-solid fa-terminal, title: patronictl, url: /patroni/patronictl/ }
          - { icon: fa-solid fa-plug, title: REST API, url: /patroni/rest_api/ }
          - { icon: fa-solid fa-arrows-rotate, title: Replication modes, url: /patroni/replication_modes/ }
          - { icon: fa-solid fa-circle-question, title: FAQ, url: /patroni/faq/ }
    - ref: 02 / BACKUP & RECOVERY
      title: pgBackRest
      url: /pgbackrest/
      motto: Reliable backup, archive, restore, and point-in-time recovery
      bullets:
        - Full, differential, incremental, and block-level backups.
        - Manages repositories, retention, and WAL archiving.
        - Documents guided deployments and every command.
      value: Start with your OS guide, then keep configuration and commands close.
      visual:
        type: components
        compact: true
        columns: 2
        aria_label: pgBackRest documentation shortcuts
        items:
          - { icon: fa-solid fa-route, title: User guide, url: /pgbackrest/user-guide/ }
          - { icon: fa-brands fa-redhat, title: RHEL guide, url: /pgbackrest/user-guide-rhel/ }
          - { icon: fa-solid fa-sliders, title: Configuration, url: /pgbackrest/configuration/ }
          - { icon: fa-solid fa-terminal, title: Commands, url: /pgbackrest/command/ }
          - { icon: fa-solid fa-tags, title: Releases, url: /pgbackrest/release/ }
          - { icon: fa-solid fa-circle-question, title: FAQ, url: /pgbackrest/faq/ }
    - ref: 03 / CONNECTION POOLING
      title: PgBouncer
      url: /pgbouncer/
      motto: A lightweight connection pooler for PostgreSQL
      bullets:
        - Reuses connections to cut backend startup cost.
        - Offers session, transaction, and statement pooling.
        - Covers authentication, routing, limits, and the console.
      value: Read the pooling model first, then install and tune for your workload.
      visual:
        type: components
        compact: true
        columns: 2
        aria_label: PgBouncer documentation shortcuts
        items:
          - { icon: fa-solid fa-list-check, title: Features, url: /pgbouncer/features/ }
          - { icon: fa-solid fa-download, title: Download, url: /pgbouncer/download/ }
          - { icon: fa-solid fa-wrench, title: Installation, url: /pgbouncer/install/ }
          - { icon: fa-solid fa-terminal, title: Usage, url: /pgbouncer/usage/ }
          - { icon: fa-solid fa-sliders, title: Configuration, url: /pgbouncer/config/ }
          - { icon: fa-solid fa-circle-question, title: FAQ, url: /pgbouncer/faq/ }
    - ref: 04 / LOG ANALYSIS
      title: pgBadger
      url: /pgbadger/
      motto: Fast PostgreSQL and PgBouncer log analysis
      bullets:
        - Parses PostgreSQL and PgBouncer logs in many formats.
        - Reports slow queries, errors, locks, and vacuum activity.
        - Generates self-contained HTML, JSON, text, and CSV output.
      value: Configure logging first, then pick one-shot, parallel, or incremental.
      visual:
        type: components
        compact: true
        columns: 2
        aria_label: pgBadger documentation shortcuts
        items:
          - { icon: fa-solid fa-download, title: Download, url: /pgbadger/download/ }
          - { icon: fa-solid fa-terminal, title: Command line, url: /pgbadger/command-line/ }
          - { icon: fa-solid fa-file-lines, title: PostgreSQL logging, url: /pgbadger/postgresql-logging/ }
          - { icon: fa-solid fa-calendar-days, title: Incremental reports, url: /pgbadger/incremental-reports/ }
          - { icon: fa-solid fa-file-export, title: Output formats, url: /pgbadger/output-formats/ }
          - { icon: fa-solid fa-chart-column, title: Sample reports, url: /pgbadger/sample-reports/ }
          - { icon: fa-solid fa-tags, title: Releases, url: /pgbadger/releases/ }
          - { icon: fa-solid fa-life-ring, title: Support, url: /pgbadger/support/ }
    - ref: 05 / LOAD BALANCING
      title: HAProxy
      url: /haproxy/
      motto: Fast, reliable TCP and HTTP traffic management
      bullets:
        - The complete 3.4 Starter Guide as nine focused topics.
        - The Configuration Manual in its 12 native chapters.
        - The Management Guide in 13 operational chapters.
      value: Learn the architecture, look up every keyword, and operate HAProxy.
      visual:
        type: components
        compact: true
        columns: 2
        aria_label: HAProxy documentation shortcuts
        items:
          - { icon: fa-solid fa-compass, title: Starter Guide, url: /haproxy/load-balancing/ }
          - { icon: fa-solid fa-file-code, title: Configuration Manual, url: /haproxy/http-fundamentals/ }
          - { icon: fa-solid fa-right-left, title: Proxy directives, url: /haproxy/proxies/ }
          - { icon: fa-solid fa-filter, title: ACLs & samples, url: /haproxy/acls-and-samples/ }
          - { icon: fa-solid fa-screwdriver-wrench, title: Management Guide, url: /haproxy/prerequisites/ }
          - { icon: fa-solid fa-chart-line, title: Runtime CLI & stats, url: /haproxy/statistics-and-monitoring/ }
          - { icon: fa-solid fa-bug, title: Debugging, url: /haproxy/debugging-and-performance/ }
          - { icon: fa-solid fa-shield-halved, title: Security, url: /haproxy/security/ }
    - ref: 06 / CONSENSUS & COORDINATION
      title: etcd
      url: /etcd/
      motto: A strongly consistent distributed key-value store
      bullets:
        - A durable key-value API built on the Raft algorithm.
        - Covers configuration, security, maintenance, and tuning.
        - Documents client APIs, upgrades, and internal design.
      value: Start with the quickstart, then the ops guide and v3 API reference.
      visual:
        type: components
        compact: true
        columns: 2
        aria_label: etcd documentation shortcuts
        items:
          - { icon: fa-solid fa-bolt, title: Quickstart, url: /etcd/quickstart/ }
          - { icon: fa-solid fa-download, title: Install, url: /etcd/install/ }
          - { icon: fa-solid fa-sliders, title: Configuration, url: /etcd/op-guide/configuration/ }
          - { icon: fa-solid fa-screwdriver-wrench, title: Maintenance, url: /etcd/op-guide/maintenance/ }
          - { icon: fa-solid fa-code, title: API, url: /etcd/learning/api/ }
          - { icon: fa-solid fa-arrow-up-right-dots, title: Upgrade to 3.7, url: /etcd/upgrades/upgrade_3_7/ }

faq:
  eyebrow: FAQ
  title: A few useful answers
  items:
    - question: Where should I start?
      answer: Choose the component that matches your current task. Each card opens an independent documentation root, and the detailed section above links directly to its most-used pages.
      open: true
    - question: Is doc.pg.center an official PostgreSQL website?
      answer: "No. doc.pg.center is the component documentation site of [pg.center](https://pg.center/), maintained by PGSTY. This independent community edition links to the original projects and preserves their attribution and licences."
    - question: "Which languages are available?"
      answer: "All six collections are available in English, Simplified Chinese, French, Japanese, German, and Russian. Use the language selector to open the same page in another language."
    - question: How is the upstream documentation credited?
      answer: Every page ends with one line naming the work it is adapted from, its copyright holder, its licence, and a link to this site's change history for that page. The [attribution page](/attribution/) collects the pinned revisions, licences, and retained notices for all six collections.
