hero:
  class: pgsql-hero pgsql-hero--fit-title
  eyebrow: Multilingual documentation for six independent components
  title_lines:
    - words:
        - { mark: P, color: blue, text: ostgreSQL }
    - words:
        - { text: Community Components }
  lead: Independent, elegant, multilingual documentation.
  links_label: Component documentation
  orbit:
    center_image: img/slonik.svg

components:
  class: pgsql-components
  eyebrow: Choose a documentation root
  title: Six components. Six direct entrances.
  text: English, Simplified Chinese, and French cover all six collections. Japanese covers Patroni, PgBouncer, and pgBadger, Russian covers four collections, and German provides translated pages across five. Missing translations fall back to English and carry an EN marker.
  columns: 3
  link_label: Read the docs
  items:
    - title: Patroni
      meta: High availability
      icon: fa-solid fa-heart-pulse
      desc: Run PostgreSQL clusters with distributed consensus and automatic failover.
      url: /docs/patroni/
    - title: pgBackRest
      meta: Backup & recovery
      icon: fa-solid fa-couch
      desc: Design reliable backup, restore, archive, and point-in-time recovery workflows.
      url: /docs/pgbackrest/
    - title: PgBouncer
      meta: Connection pooling
      icon: fa-solid fa-arrows-turn-to-dots
      desc: Cut connection overhead with session, transaction, and statement pooling.
      url: /docs/pgbouncer/
    - title: pgBadger
      meta: Log analysis
      icon: fa-solid fa-otter
      desc: Turn PostgreSQL and PgBouncer logs into query, workload, and error reports.
      url: /docs/pgbadger/
    - title: HAProxy
      meta: Load balancing
      icon: fa-solid fa-network-wired
      desc: Read the complete HAProxy 3.4 Starter, Configuration, and Management manuals.
      url: /docs/haproxy/
    - title: etcd
      meta: Consensus & coordination
      icon: fa-solid fa-gear
      desc: Operate a strongly consistent key-value store, its APIs, Raft model, and internals.
      url: /docs/etcd/

capabilities:
  eyebrow: Component guides
  title: What each component does — and where to start
  text: Read the short orientation, then use the linked index beside it to jump directly into the manual.
  items:
    - ref: 01 / HIGH AVAILABILITY
      title: Patroni
      url: /docs/patroni/
      motto: A template for PostgreSQL high availability
      bullets:
        - Runs leader election and cluster state through a DCS.
        - Automates failover, with controls for planned changes.
        - Covers bare metal, VMs, Kubernetes, and multi-datacenter.
      value: Start with installation and configuration, then the operational surfaces.
      visual:
        type: components
        compact: true
        columns: 2
        aria_label: Patroni documentation shortcuts
        items:
          - { icon: fa-solid fa-download, title: Installation, url: /docs/patroni/installation/ }
          - { icon: fa-solid fa-sliders, title: Configuration, url: /docs/patroni/config/ }
          - { icon: fa-solid fa-terminal, title: patronictl, url: /docs/patroni/patronictl/ }
          - { icon: fa-solid fa-plug, title: REST API, url: /docs/patroni/rest_api/ }
          - { icon: fa-solid fa-arrows-rotate, title: Replication modes, url: /docs/patroni/replication_modes/ }
          - { icon: fa-solid fa-circle-question, title: FAQ, url: /docs/patroni/faq/ }
    - ref: 02 / BACKUP & RECOVERY
      title: pgBackRest
      url: /docs/pgbackrest/
      motto: Reliable backup, archive, restore, and point-in-time recovery
      bullets:
        - Full, differential, incremental, and block-level backups.
        - Manages repositories, retention, and WAL archiving.
        - Documents guided deployments and every command.
      value: Start with your OS guide, then keep configuration and commands close.
      visual:
        type: components
        compact: true
        columns: 2
        aria_label: pgBackRest documentation shortcuts
        items:
          - { icon: fa-solid fa-route, title: User guide, url: /docs/pgbackrest/user-guide/ }
          - { icon: fa-brands fa-redhat, title: RHEL guide, url: /docs/pgbackrest/user-guide-rhel/ }
          - { icon: fa-solid fa-sliders, title: Configuration, url: /docs/pgbackrest/configuration/ }
          - { icon: fa-solid fa-terminal, title: Commands, url: /docs/pgbackrest/command/ }
          - { icon: fa-solid fa-tags, title: Releases, url: /docs/pgbackrest/release/ }
          - { icon: fa-solid fa-circle-question, title: FAQ, url: /docs/pgbackrest/faq/ }
    - ref: 03 / CONNECTION POOLING
      title: PgBouncer
      url: /docs/pgbouncer/
      motto: A lightweight connection pooler for PostgreSQL
      bullets:
        - Reuses connections to cut backend startup cost.
        - Offers session, transaction, and statement pooling.
        - Covers authentication, routing, limits, and the console.
      value: Read the pooling model first, then install and tune for your workload.
      visual:
        type: components
        compact: true
        columns: 2
        aria_label: PgBouncer documentation shortcuts
        items:
          - { icon: fa-solid fa-list-check, title: Features, url: /docs/pgbouncer/features/ }
          - { icon: fa-solid fa-download, title: Download, url: /docs/pgbouncer/download/ }
          - { icon: fa-solid fa-wrench, title: Installation, url: /docs/pgbouncer/install/ }
          - { icon: fa-solid fa-terminal, title: Usage, url: /docs/pgbouncer/usage/ }
          - { icon: fa-solid fa-sliders, title: Configuration, url: /docs/pgbouncer/config/ }
          - { icon: fa-solid fa-circle-question, title: FAQ, url: /docs/pgbouncer/faq/ }
    - ref: 04 / LOG ANALYSIS
      title: pgBadger
      url: /docs/pgbadger/
      motto: Fast PostgreSQL and PgBouncer log analysis
      bullets:
        - Parses PostgreSQL and PgBouncer logs in many formats.
        - Reports slow queries, errors, locks, and vacuum activity.
        - Generates self-contained HTML, JSON, text, and CSV output.
      value: Configure logging first, then pick one-shot, parallel, or incremental.
      visual:
        type: components
        compact: true
        columns: 2
        aria_label: pgBadger documentation shortcuts
        items:
          - { icon: fa-solid fa-download, title: Download, url: /docs/pgbadger/download/ }
          - { icon: fa-solid fa-terminal, title: Command line, url: /docs/pgbadger/command-line/ }
          - { icon: fa-solid fa-file-lines, title: PostgreSQL logging, url: /docs/pgbadger/postgresql-logging/ }
          - { icon: fa-solid fa-calendar-days, title: Incremental reports, url: /docs/pgbadger/incremental-reports/ }
          - { icon: fa-solid fa-file-export, title: Output formats, url: /docs/pgbadger/output-formats/ }
          - { icon: fa-solid fa-chart-column, title: Sample reports, url: /docs/pgbadger/sample-reports/ }
          - { icon: fa-solid fa-tags, title: Releases, url: /docs/pgbadger/releases/ }
          - { icon: fa-solid fa-life-ring, title: Support, url: /docs/pgbadger/support/ }
    - ref: 05 / LOAD BALANCING
      title: HAProxy
      url: /docs/haproxy/
      motto: Fast, reliable TCP and HTTP traffic management
      bullets:
        - The complete 3.4 Starter Guide as nine focused topics.
        - The Configuration Manual in its 12 native chapters.
        - The Management Guide in 13 operational chapters.
      value: Learn the architecture, look up every keyword, and operate HAProxy.
      visual:
        type: components
        compact: true
        columns: 2
        aria_label: HAProxy documentation shortcuts
        items:
          - { icon: fa-solid fa-compass, title: Starter Guide, url: /docs/haproxy/load-balancing/ }
          - { icon: fa-solid fa-file-code, title: Configuration Manual, url: /docs/haproxy/http-fundamentals/ }
          - { icon: fa-solid fa-right-left, title: Proxy directives, url: /docs/haproxy/proxies/ }
          - { icon: fa-solid fa-filter, title: ACLs & samples, url: /docs/haproxy/acls-and-samples/ }
          - { icon: fa-solid fa-screwdriver-wrench, title: Management Guide, url: /docs/haproxy/prerequisites/ }
          - { icon: fa-solid fa-chart-line, title: Runtime CLI & stats, url: /docs/haproxy/statistics-and-monitoring/ }
          - { icon: fa-solid fa-bug, title: Debugging, url: /docs/haproxy/debugging-and-performance/ }
          - { icon: fa-solid fa-shield-halved, title: Security, url: /docs/haproxy/security/ }
    - ref: 06 / CONSENSUS & COORDINATION
      title: etcd
      url: /docs/etcd/
      motto: A strongly consistent distributed key-value store
      bullets:
        - A durable key-value API built on the Raft algorithm.
        - Covers configuration, security, maintenance, and tuning.
        - Documents client APIs, upgrades, and internal design.
      value: Start with the quickstart, then the ops guide and v3 API reference.
      visual:
        type: components
        compact: true
        columns: 2
        aria_label: etcd documentation shortcuts
        items:
          - { icon: fa-solid fa-bolt, title: Quickstart, url: /docs/etcd/quickstart/ }
          - { icon: fa-solid fa-download, title: Install, url: /docs/etcd/install/ }
          - { icon: fa-solid fa-sliders, title: Configuration, url: /docs/etcd/op-guide/configuration/ }
          - { icon: fa-solid fa-screwdriver-wrench, title: Maintenance, url: /docs/etcd/op-guide/maintenance/ }
          - { icon: fa-solid fa-code, title: API, url: /docs/etcd/learning/api/ }
          - { icon: fa-solid fa-arrow-up-right-dots, title: Upgrade to 3.7, url: /docs/etcd/upgrades/upgrade_3_7/ }

faq:
  eyebrow: FAQ
  title: A few useful answers
  items:
    - question: Where should I start?
      answer: Choose the component that matches your current task. Each card opens an independent documentation root, and the detailed section above links directly to its most-used pages.
      open: true
    - question: Is pig.center an official PostgreSQL website?
      answer: No. pig.center is an independent community documentation project. It links back to each upstream project and keeps product names and technical context intact.
    - question: How does partial language coverage work?
      answer: A link opens the current language whenever that page exists. If it has not been translated yet, the same link opens the English page and shows an EN marker; the language selector remains available on every page.
    - question: How is the upstream documentation credited?
      answer: Every page ends with one line naming the work it is adapted from, its copyright holder, its licence, and a link to this site's change history for that page. The [attribution page](/attribution/) collects the pinned revisions, licences, and retained notices for all six collections.
