about:
  title: "About this site"
  items:
    - title: "An independent community edition"
      text: "PG.CENTER is maintained by PGSTY and is not an official PostgreSQL website. Each collection links to its original project and keeps its attribution and licence."
      icon: fa-solid fa-people-group
      url: https://pg.center/
    - title: "Sources and licences"
      text: "Every page ends with a line naming the work it adapts, its copyright holder and its licence. The attribution page lists the pinned upstream revisions and retained notices."
      icon: fa-solid fa-scale-balanced
      url: /attribution/
