      url: /ivorysql/reference/
      icon: fa-solid fa-book-open
  - title: Babelfish
    meta: SQL Server compatibility
    version: '6.2.0'
    icon: fa-solid fa-fish
    desc: Run T-SQL over the TDS protocol, with migration and compatibility guidance.
