  items:
    - title: "独立的社区版本"
      text: "PG.CENTER 由 PGSTY 维护，不是 PostgreSQL 官方网站。各文档集都链接到原项目，并保留其署名与授权声明。"
      icon: fa-solid fa-people-group
      url: https://pg.center/zh/
    - title: "来源与授权"
      text: "每页末尾注明改编自哪份作品、版权归属与授权协议；归属页汇总各文档集的上游固定版本与保留的完整声明。"
      icon: fa-solid fa-scale-balanced
      url: /attribution/
