sections:
  - key: hero
    partial: pgsql/hero-orbit.html
  - type: cards
    key: components
  - key: capabilities
    partial: pgsql/capabilities.html
  - faq

hero:
  class: pgsql-hero pgsql-hero--fit-title pgsql-hero--fit-title-cjk
  eyebrow: "PG.CENTER / 生态组件文档"
  title_lines:
    - words:
        - { mark: P, color: blue, text: ostgreSQL }
    - words:
        - { text: "生态组件文档" }
  lead: "查阅 PostgreSQL 生产运维工具的使用指南与参考手册。"
  note: "六个组件，六种语言。本站是 [pg.center](https://pg.center/zh/) 的文档子站。"
  note_icon: fa-solid fa-book-open
  links_label: 组件文档
  orbit:
    center_image: img/slonik.svg

components:
  class: pgsql-components
  eyebrow: "组件文档"
  title: "选择你需要的文档"
  text: "所有组件文档均提供英文、简体中文、法文、日文、德文和俄文版本。"
  columns: 3
  link_label: 阅读文档
  items:
    - title: Patroni
      meta: 高可用
      icon: fa-solid fa-heart-pulse
      desc: 使用分布式共识、健康检查与自动故障转移，构建并运行 PostgreSQL 高可用集群。
      url: /patroni/
    - title: pgBackRest
      meta: 备份与恢复
      icon: fa-solid fa-couch
      desc: 设计可靠的备份、恢复、归档、保留策略与时间点恢复工作流。
      url: /pgbackrest/
    - title: PgBouncer
      meta: 连接池
      icon: fa-solid fa-arrows-turn-to-dots
      desc: 降低连接开销，理解会话、事务与语句池化模式的行为边界。
      url: /pgbouncer/
    - title: pgBadger
      meta: 日志分析
      icon: fa-solid fa-otter
      desc: 把 PostgreSQL 与 PgBouncer 日志转化为查询、负载、错误与运行报告。
      url: /pgbadger/
    - title: HAProxy
      meta: 负载均衡
      icon: fa-solid fa-network-wired
      desc: 阅读完整的 HAProxy 3.4 入门、配置与管理中文手册。
      url: /haproxy/
    - title: etcd
      meta: 共识与协调
      icon: fa-solid fa-gear
      desc: 运维强一致分布式键值存储，并理解其 API、Raft 模型、版本升级与内部原理。
      url: /etcd/

capabilities:
  eyebrow: 组件指南
  title: 每个组件解决什么问题，以及从哪里开始
  text: 先读简短说明，再用右侧索引直接进入对应手册的具体页面。
  items:
    - ref: 01 / 高可用
      title: Patroni
      url: /patroni/
      motto: PostgreSQL 高可用方案模板
      bullets:
        - 通过分布式配置存储协调领导者选举与集群状态。
        - 自动执行故障转移，同时为计划内运维保留明确、可控的操作接口。
        - 覆盖物理机、虚拟机、Kubernetes、Watchdog 与多数据中心模式。
      value: 从安装与配置开始，再学习日常运维接口。
      visual:
        type: components
        compact: true
        columns: 2
        aria_label: Patroni 文档快捷入口
        items:
          - { icon: fa-solid fa-download, title: 安装, url: /patroni/installation/ }
          - { icon: fa-solid fa-sliders, title: 配置, url: /patroni/config/ }
          - { icon: fa-solid fa-terminal, title: patronictl, url: /patroni/patronictl/ }
          - { icon: fa-solid fa-plug, title: REST API, url: /patroni/rest_api/ }
          - { icon: fa-solid fa-arrows-rotate, title: 复制模式, url: /patroni/replication_modes/ }
          - { icon: fa-solid fa-circle-question, title: 常见问题, url: /patroni/faq/ }
    - ref: 02 / 备份与恢复
      title: pgBackRest
      url: /pgbackrest/
      motto: 可靠地完成备份、归档、恢复与时间点恢复
      bullets:
        - 支持全量、差异、增量与块级备份，并可并行处理。
        - 管理仓库、保留策略、加密、对象存储与异步 WAL 归档。
        - 同时提供按系统编写的操作指南与覆盖全部命令的参考手册。
      value: 先选择适合操作系统的指南，再把配置与命令参考放在手边。
      visual:
        type: components
        compact: true
        columns: 2
        aria_label: pgBackRest 文档快捷入口
        items:
          - { icon: fa-solid fa-route, title: 用户指南, url: /pgbackrest/user-guide/ }
          - { icon: fa-brands fa-redhat, title: RHEL 指南, url: /pgbackrest/user-guide-rhel/ }
          - { icon: fa-solid fa-sliders, title: 配置参考, url: /pgbackrest/configuration/ }
          - { icon: fa-solid fa-terminal, title: 命令参考, url: /pgbackrest/command/ }
          - { icon: fa-solid fa-tags, title: 版本记录, url: /pgbackrest/release/ }
          - { icon: fa-solid fa-circle-question, title: 常见问题, url: /pgbackrest/faq/ }
    - ref: 03 / 连接池
      title: PgBouncer
      url: /pgbouncer/
      motto: 轻量级 PostgreSQL 连接池
      bullets:
        - 复用 PostgreSQL 连接，减少后端进程启动成本与连接压力。
        - 提供会话、事务与语句池化模式，并明确说明各自的兼容边界。
        - 用一套紧凑手册讲清认证、路由、连接限制、超时与管理控制台。
      value: 先理解池化模型，再针对工作负载安装并调整配置。
      visual:
        type: components
        compact: true
        columns: 2
        aria_label: PgBouncer 文档快捷入口
        items:
          - { icon: fa-solid fa-list-check, title: 功能特性, url: /pgbouncer/features/ }
          - { icon: fa-solid fa-download, title: 下载, url: /pgbouncer/download/ }
          - { icon: fa-solid fa-wrench, title: 安装, url: /pgbouncer/install/ }
          - { icon: fa-solid fa-terminal, title: 使用方法, url: /pgbouncer/usage/ }
          - { icon: fa-solid fa-sliders, title: 配置参考, url: /pgbouncer/config/ }
          - { icon: fa-solid fa-circle-question, title: 常见问题, url: /pgbouncer/faq/ }
    - ref: 04 / 日志分析
      title: pgBadger
      url: /pgbadger/
      motto: 快速分析 PostgreSQL 与 PgBouncer 日志
      bullets:
        - 解析多种 PostgreSQL 日志格式、压缩文件、远程输入与 PgBouncer 日志。
        - 汇总慢查询、高频查询、错误、会话、锁、检查点与 Vacuum 活动等信息。
        - 生成自包含 HTML、增量报告，以及 JSON、文本、二进制与 CSV 输出。
      value: 先把日志配置正确，再选择一次性、并行或增量报告方式。
      visual:
        type: components
        compact: true
        columns: 2
        aria_label: pgBadger 文档快捷入口
        items:
          - { icon: fa-solid fa-download, title: 下载, url: /pgbadger/download/ }
          - { icon: fa-solid fa-terminal, title: 命令行, url: /pgbadger/command-line/ }
          - { icon: fa-solid fa-file-lines, title: PostgreSQL 日志, url: /pgbadger/postgresql-logging/ }
          - { icon: fa-solid fa-calendar-days, title: 增量报告, url: /pgbadger/incremental-reports/ }
          - { icon: fa-solid fa-file-export, title: 输出格式, url: /pgbadger/output-formats/ }
          - { icon: fa-solid fa-chart-column, title: 示例报告, url: /pgbadger/sample-reports/ }
          - { icon: fa-solid fa-tags, title: 版本记录, url: /pgbadger/releases/ }
          - { icon: fa-solid fa-life-ring, title: 支持, url: /pgbadger/support/ }
    - ref: 05 / 负载均衡
      title: HAProxy
      url: /haproxy/
      motto: 快速、可靠的 TCP 与 HTTP 流量管理
      bullets:
        - 从负载均衡、健康检查与连接管理开始，理解 HAProxy 的工作方式。
        - 按需查阅全局配置、代理配置项、ACL 与 HTTP 处理规则。
        - 通过运行时 CLI、监控、调试与安全指南完成日常运维。
      value: 在同一个组件根中学习架构、查阅全部配置项并完成 HAProxy 运维。
      visual:
        type: components
        compact: true
        columns: 2
        aria_label: HAProxy 中文文档快捷入口
        items:
          - { icon: fa-solid fa-compass, title: 入门指南, url: /haproxy/load-balancing/ }
          - { icon: fa-solid fa-file-code, title: 配置手册, url: /haproxy/http-fundamentals/ }
          - { icon: fa-solid fa-right-left, title: 代理配置项, url: /haproxy/proxies/ }
          - { icon: fa-solid fa-filter, title: ACL 与样本提取, url: /haproxy/acls-and-samples/ }
          - { icon: fa-solid fa-screwdriver-wrench, title: 管理指南, url: /haproxy/prerequisites/ }
          - { icon: fa-solid fa-chart-line, title: 运行时 CLI 与统计, url: /haproxy/statistics-and-monitoring/ }
          - { icon: fa-solid fa-bug, title: 调试与性能, url: /haproxy/debugging-and-performance/ }
          - { icon: fa-solid fa-shield-halved, title: 安全, url: /haproxy/security/ }
    - ref: 06 / 共识与协调
      title: etcd
      url: /etcd/
      motto: 强一致分布式键值存储
      bullets:
        - 基于 Raft 共识算法提供持久化键值 API，为分布式系统提供协调能力。
        - 覆盖集群配置、安全、维护、监控、恢复与性能调优。
        - 包含客户端 API、开发任务、版本升级与降级，以及内部设计说明。
      value: 先读快速上手，再进入运维指南与 v3 API 参考。
      visual:
        type: components
        compact: true
        columns: 2
        aria_label: etcd 文档快捷入口
        items:
          - { icon: fa-solid fa-bolt, title: 快速上手, url: /etcd/quickstart/ }
          - { icon: fa-solid fa-download, title: 安装, url: /etcd/install/ }
          - { icon: fa-solid fa-sliders, title: 配置, url: /etcd/op-guide/configuration/ }
          - { icon: fa-solid fa-screwdriver-wrench, title: 维护, url: /etcd/op-guide/maintenance/ }
          - { icon: fa-solid fa-code, title: API, url: /etcd/learning/api/ }
          - { icon: fa-solid fa-arrow-up-right-dots, title: 升级到 3.7, url: /etcd/upgrades/upgrade_3_7/ }

faq:
  eyebrow: 常见问题
  title: 几个有用的答案
  items:
    - question: 应该从哪里开始？
      answer: 选择与你当前任务对应的组件。每张卡片都会进入一套独立文档；上方的详细说明还提供了常用页面的直达入口。
      open: true
    - question: PG.CENTER 是 PostgreSQL 官方网站吗？
      answer: "不是。这是 [PG.CENTER](https://pg.center/zh/) 的组件文档，由 PGSTY 维护。这是独立的社区整理与翻译版本，保留各上游项目的链接、署名与授权声明。"
    - question: "提供哪些语言版本？"
      answer: "六套文档均提供英文、简体中文、法文、日文、德文和俄文版本。使用页面上的语言选择器，可以打开同一页面的其他语言版本。"
    - question: 上游文档的归属如何标注？
      answer: 每个页面末尾都有一行署名，指明该页改编自哪份作品、版权归属、授权协议，以及本站中该页面的修改历史链接。[归属与授权页面](/zh/attribution/)汇总了六套文档集的固定版本、授权协议与完整声明。
