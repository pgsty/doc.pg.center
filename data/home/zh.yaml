    - title: SQL 与 API
      url: /citus/reference/
      icon: fa-solid fa-code
    - title: 专题与博客
      url: /citus/articles/
      icon: fa-solid fa-newspaper

  - title: DocumentDB
    meta: 文档数据库
    version: '1.0'
    icon: fa-solid fa-file-code
