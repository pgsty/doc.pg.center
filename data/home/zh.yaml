# doc.pg.center home (zh): hero with the eight reading languages, six tool
# manuals with their most-used pages, PostgreSQL and eleven kernel collections, and
# two facts about the site. Partials live in layouts/_partials/pgsql/. Keep the
# eight language files in step.
sections:
  - { key: hero, partial: pgsql/hero-orbit.html }
  - { key: kernels, partial: pgsql/manuals.html }
  - { key: components, partial: pgsql/manuals.html }
  - { key: about, partial: pgsql/about.html }

hero:
  class: pgsql-hero pgsql-hero--fit-title pgsql-hero--fit-title-cjk
  title_lines:
    - words:
        - { mark: "P", color: "blue", text: "ostgreSQL" }
    - words:
        - { text: "生态组件文档" }
  lead: "查阅 PostgreSQL 运维工具与数据库内核的使用指南和参考手册。"
  note: "六个组件提供八种语言，十一套内核文档收录英中两版。本站是 [pg.center](https://pg.center/zh/) 的文档子站。"
  note_icon: fa-solid fa-book-open
  languages_label: "阅读语言"
  orbit:
    center_image: img/slonik.svg

components:
  title: "社区组件"
  items:
    - title: "Patroni"
      meta: "高可用"
      version: v4.1.5
      icon: fa-solid fa-heart-pulse
      desc: "使用分布式共识、健康检查与自动故障转移，构建并运行 PostgreSQL 高可用集群。"
      url: /patroni/
      shortcuts_label: "Patroni 文档快捷入口"
      shortcuts:
        - { title: "安装", url: /patroni/installation/, icon: fa-solid fa-download }
        - { title: "配置", url: /patroni/config/, icon: fa-solid fa-sliders }
        - { title: "patronictl", url: /patroni/patronictl/, icon: fa-solid fa-terminal }
        - { title: "REST API", url: /patroni/rest_api/, icon: fa-solid fa-plug }
    - title: "pgBackRest"
      meta: "备份与恢复"
      version: v2.60.0
      icon: fa-solid fa-couch
      desc: "设计可靠的备份、恢复、归档、保留策略与时间点恢复工作流。"
      url: /pgbackrest/
      shortcuts_label: "pgBackRest 文档快捷入口"
      shortcuts:
        - { title: "用户指南", url: /pgbackrest/user-guide/, icon: fa-solid fa-route }
        - { title: "配置参考", url: /pgbackrest/configuration/, icon: fa-solid fa-sliders }
        - { title: "命令参考", url: /pgbackrest/command/, icon: fa-solid fa-terminal }
        - { title: "常见问题", url: /pgbackrest/faq/, icon: fa-solid fa-circle-question }
    - title: "PgBouncer"
      meta: "连接池"
      version: v1.26.1
      icon: fa-solid fa-arrows-turn-to-dots
      desc: "降低连接开销，理解会话、事务与语句池化模式的行为边界。"
      url: /pgbouncer/
      shortcuts_label: "PgBouncer 文档快捷入口"
      shortcuts:
        - { title: "安装", url: /pgbouncer/install/, icon: fa-solid fa-wrench }
        - { title: "使用方法", url: /pgbouncer/usage/, icon: fa-solid fa-terminal }
        - { title: "配置参考", url: /pgbouncer/config/, icon: fa-solid fa-sliders }
        - { title: "常见问题", url: /pgbouncer/faq/, icon: fa-solid fa-circle-question }
    - title: "pgBadger"
      meta: "日志分析"
      version: v13.2-dev
      icon: fa-solid fa-otter
      desc: "把 PostgreSQL 与 PgBouncer 日志转化为查询、负载、错误与运行报告。"
      url: /pgbadger/
      shortcuts_label: "pgBadger 文档快捷入口"
      shortcuts:
        - { title: "PostgreSQL 日志", url: /pgbadger/postgresql-logging/, icon: fa-solid fa-file-lines }
        - { title: "命令行", url: /pgbadger/command-line/, icon: fa-solid fa-terminal }
        - { title: "增量报告", url: /pgbadger/incremental-reports/, icon: fa-solid fa-calendar-days }
        - { title: "示例报告", url: /pgbadger/sample-reports/, icon: fa-solid fa-chart-column }
    - title: "HAProxy"
      meta: "负载均衡"
      version: v3.4
      icon: fa-solid fa-network-wired
      desc: "阅读完整的 HAProxy 3.4 入门、配置与管理中文手册。"
      url: /haproxy/
      shortcuts_label: "HAProxy 中文文档快捷入口"
      shortcuts:
        - { title: "入门指南", url: /haproxy/load-balancing/, icon: fa-solid fa-compass }
        - { title: "配置手册", url: /haproxy/http-fundamentals/, icon: fa-solid fa-file-code }
        - { title: "管理指南", url: /haproxy/prerequisites/, icon: fa-solid fa-screwdriver-wrench }
        - { title: "ACL 与样本提取", url: /haproxy/acls-and-samples/, icon: fa-solid fa-filter }
    - title: "etcd"
      meta: "共识与协调"
      version: v3.7.3
      icon: fa-solid fa-gear
      desc: "运维强一致分布式键值存储，并理解其 API、Raft 模型、版本升级与内部原理。"
      url: /etcd/
      shortcuts_label: "etcd 文档快捷入口"
      shortcuts:
        - { title: "快速上手", url: /etcd/quickstart/, icon: fa-solid fa-bolt }
        - { title: "安装", url: /etcd/install/, icon: fa-solid fa-download }
        - { title: "配置", url: /etcd/op-guide/configuration/, icon: fa-solid fa-sliders }
        - { title: "API", url: /etcd/learning/api/, icon: fa-solid fa-code }

kernels:
  class: pgsql-manuals--kernels
  legacy_id: databases
  title: PostgreSQL 内核
  desc: PostgreSQL 全版本手册与十一套内核文档，提供英中两版入口。
  items:
  - title: PostgreSQL
    meta: PostgreSQL 原生内核
    version: '18.6'
    icon: pgsql-icon-postgresql
    desc: 阅读活跃版本手册、预览 PostgreSQL 19，或查阅历代版本的完整文档。
    url: /postgresql/
    shortcuts_label: PostgreSQL 文档快捷入口
    shortcuts:
    - title: 当前稳定版 · 18.6
      url: https://pgsql.cc/docs/18/index.html
      icon: fa-solid fa-book-open
    - title: 活跃版本
      url: /postgresql/#supported
      icon: fa-solid fa-layer-group
    - title: PostgreSQL 19 预览
      url: /postgresql/#development
      icon: fa-solid fa-flask
    - title: 历史版本
      url: /postgresql/#historical
      icon: fa-solid fa-clock-rotate-left
  - title: Citus
    meta: 分布式 PostgreSQL
    version: '14'
    icon: fa-solid fa-table-cells-large
    desc: 通过分片、并行查询、共置与分布式表扩展 PostgreSQL。
    url: /citus/
    shortcuts_label: Citus 文档快捷入口
    shortcuts:
