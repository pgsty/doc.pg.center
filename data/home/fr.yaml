# doc.pg.center home (fr): hero with the eight reading languages, the six
# manuals with their most-used pages, and two facts about the site. Partials
# live in layouts/_partials/pgsql/. Keep the eight language files in step.
sections:
  - { key: hero, partial: pgsql/hero-orbit.html }
  - { key: components, partial: pgsql/manuals.html }
  - { key: about, partial: pgsql/about.html }

hero:
  class: pgsql-hero pgsql-hero--fit-title
  title_lines:
    - words:
        - { mark: "P", color: "blue", text: "ostgreSQL" }
    - words:
        - { text: "Documentation des composants" }
  lead: "Guides et références pour les outils qui accompagnent PostgreSQL en production."
  note: "Six composants, huit langues. Un site de [pg.center](https://pg.center/)."
  note_icon: fa-solid fa-book-open
  languages_label: "Lire en"
  orbit:
    center_image: img/slonik.svg

components:
  title: "Composants communautaires"
  items:
    - title: "Patroni"
      meta: "Haute disponibilité"
      version: v4.1.5
      icon: fa-solid fa-heart-pulse
      desc: "Exploitez des clusters PostgreSQL avec consensus distribué et basculement automatique."
      url: /patroni/
      shortcuts_label: "Raccourcis vers la documentation Patroni"
      shortcuts:
        - { title: "Installation", url: /patroni/installation/, icon: fa-solid fa-download }
        - { title: "Configuration", url: /patroni/config/, icon: fa-solid fa-sliders }
        - { title: "patronictl", url: /patroni/patronictl/, icon: fa-solid fa-terminal }
        - { title: "API REST", url: /patroni/rest_api/, icon: fa-solid fa-plug }
    - title: "pgBackRest"
      meta: "Sauvegarde et restauration"
      version: v2.60.0
      icon: fa-solid fa-couch
      desc: "Sauvegarde, restauration et archivage fiables, avec récupération à un instant donné."
      url: /pgbackrest/
      shortcuts_label: "Raccourcis vers la documentation pgBackRest"
      shortcuts:
        - { title: "Guide utilisateur", url: /pgbackrest/user-guide/, icon: fa-solid fa-route }
        - { title: "Configuration", url: /pgbackrest/configuration/, icon: fa-solid fa-sliders }
        - { title: "Commandes", url: /pgbackrest/command/, icon: fa-solid fa-terminal }
        - { title: "FAQ", url: /pgbackrest/faq/, icon: fa-solid fa-circle-question }
    - title: "PgBouncer"
      meta: "Pooling de connexions"
      version: v1.26.1
      icon: fa-solid fa-arrows-turn-to-dots
      desc: "Réduisez le coût des connexions avec le pooling par session, transaction ou instruction."
      url: /pgbouncer/
      shortcuts_label: "Raccourcis vers la documentation PgBouncer"
      shortcuts:
        - { title: "Installation", url: /pgbouncer/install/, icon: fa-solid fa-wrench }
        - { title: "Utilisation", url: /pgbouncer/usage/, icon: fa-solid fa-terminal }
        - { title: "Configuration", url: /pgbouncer/config/, icon: fa-solid fa-sliders }
        - { title: "FAQ", url: /pgbouncer/faq/, icon: fa-solid fa-circle-question }
    - title: "pgBadger"
      meta: "Analyse des journaux"
      version: v13.2-dev
      icon: fa-solid fa-otter
      desc: "Rapports sur les requêtes, la charge et les erreurs tirés des journaux PostgreSQL et PgBouncer."
      url: /pgbadger/
      shortcuts_label: "Raccourcis vers la documentation pgBadger"
      shortcuts:
        - { title: "Journalisation PostgreSQL", url: /pgbadger/postgresql-logging/, icon: fa-solid fa-file-lines }
        - { title: "Ligne de commande", url: /pgbadger/command-line/, icon: fa-solid fa-terminal }
        - { title: "Rapports incrémentaux", url: /pgbadger/incremental-reports/, icon: fa-solid fa-calendar-days }
        - { title: "Exemples de rapports", url: /pgbadger/sample-reports/, icon: fa-solid fa-chart-column }
    - title: "HAProxy"
      meta: "Répartition de charge"
      version: v3.4
      icon: fa-solid fa-network-wired
      desc: "Les guides complets de HAProxy 3.4 : démarrage, configuration et administration."
      url: /haproxy/
      shortcuts_label: "Raccourcis vers la documentation HAProxy"
      shortcuts:
        - { title: "Guide de démarrage", url: /haproxy/load-balancing/, icon: fa-solid fa-compass }
        - { title: "Manuel de configuration", url: /haproxy/http-fundamentals/, icon: fa-solid fa-file-code }
        - { title: "Guide d'administration", url: /haproxy/prerequisites/, icon: fa-solid fa-screwdriver-wrench }
        - { title: "ACL et échantillons", url: /haproxy/acls-and-samples/, icon: fa-solid fa-filter }
    - title: "etcd"
      meta: "Consensus et coordination"
      version: v3.7.3
      icon: fa-solid fa-gear
      desc: "Exploitez un magasin clé-valeur cohérent : API, modèle Raft et fonctionnement interne."
      url: /etcd/
      shortcuts_label: "Raccourcis vers la documentation etcd"
      shortcuts:
        - { title: "Démarrage rapide", url: /etcd/quickstart/, icon: fa-solid fa-bolt }
        - { title: "Installation", url: /etcd/install/, icon: fa-solid fa-download }
        - { title: "Configuration", url: /etcd/op-guide/configuration/, icon: fa-solid fa-sliders }
        - { title: "API", url: /etcd/learning/api/, icon: fa-solid fa-code }

about:
  title: "À propos de ce site"
  items:
    - title: "Une édition communautaire indépendante"
      text: "PG.CENTER est maintenu par PGSTY et n’est pas un site officiel de PostgreSQL. Chaque collection renvoie à son projet d’origine et conserve ses mentions d’attribution et sa licence."
      icon: fa-solid fa-people-group
      url: https://pg.center/
    - title: "Sources et licences"
      text: "Chaque page se termine par une ligne indiquant l’œuvre adaptée, son titulaire de droits et sa licence. La page d’attribution rassemble les révisions amont épinglées et les mentions conservées."
      icon: fa-solid fa-scale-balanced
      url: /attribution/
