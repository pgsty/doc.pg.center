# doc.pg.center home (de): hero with the eight reading languages, the six
# manuals with their most-used pages, and two facts about the site. Partials
# live in layouts/_partials/pgsql/. Keep the eight language files in step.
sections:
  - { key: hero, partial: pgsql/hero-orbit.html }
  - { key: components, partial: pgsql/manuals.html }
  - { key: about, partial: pgsql/about.html }

hero:
  class: pgsql-hero pgsql-hero--fit-title
  title_lines:
    - words:
        - { mark: "P", color: "blue", text: "ostgreSQL" }
    - words:
        - { text: "Komponenten-Dokumentation" }
  lead: "Anleitungen und Referenzen für die Werkzeuge rund um PostgreSQL im Produktivbetrieb."
  note: "Sechs Komponenten, acht Sprachen. Ein Angebot von [pg.center](https://pg.center/)."
  note_icon: fa-solid fa-book-open
  languages_label: "Lesen auf"
  orbit:
    center_image: img/slonik.svg

components:
  title: "Community-Komponenten"
  items:
    - title: "Patroni"
      meta: "Hochverfügbarkeit"
      version: v4.1.5
      icon: fa-solid fa-heart-pulse
      desc: "Betreiben Sie PostgreSQL-Cluster mit verteiltem Konsens und automatischem Failover."
      url: /patroni/
      shortcuts_label: "Schnellzugriffe auf die Patroni-Dokumentation"
      shortcuts:
        - { title: "Installation", url: /patroni/installation/, icon: fa-solid fa-download }
        - { title: "Konfiguration", url: /patroni/config/, icon: fa-solid fa-sliders }
        - { title: "patronictl", url: /patroni/patronictl/, icon: fa-solid fa-terminal }
        - { title: "REST-API", url: /patroni/rest_api/, icon: fa-solid fa-plug }
    - title: "pgBackRest"
      meta: "Sicherung und Wiederherstellung"
      version: v2.60.0
      icon: fa-solid fa-couch
      desc: "Zuverlässige Sicherung, Wiederherstellung und Archivierung samt Point-in-Time-Recovery."
      url: /pgbackrest/
      shortcuts_label: "Schnellzugriffe auf die pgBackRest-Dokumentation"
      shortcuts:
        - { title: "Benutzerhandbuch", url: /pgbackrest/user-guide/, icon: fa-solid fa-route }
        - { title: "Konfiguration", url: /pgbackrest/configuration/, icon: fa-solid fa-sliders }
        - { title: "Befehle", url: /pgbackrest/command/, icon: fa-solid fa-terminal }
        - { title: "FAQ", url: /pgbackrest/faq/, icon: fa-solid fa-circle-question }
    - title: "PgBouncer"
      meta: "Verbindungspooling"
      version: v1.26.1
      icon: fa-solid fa-arrows-turn-to-dots
      desc: "Reduzieren Sie den Verbindungsaufwand durch Session-, Transaktions- und Statement-Pooling."
      url: /pgbouncer/
      shortcuts_label: "Schnellzugriffe auf die PgBouncer-Dokumentation"
      shortcuts:
        - { title: "Installation", url: /pgbouncer/install/, icon: fa-solid fa-wrench }
        - { title: "Verwendung", url: /pgbouncer/usage/, icon: fa-solid fa-terminal }
        - { title: "Konfiguration", url: /pgbouncer/config/, icon: fa-solid fa-sliders }
        - { title: "FAQ", url: /pgbouncer/faq/, icon: fa-solid fa-circle-question }
    - title: "pgBadger"
      meta: "Protokollanalyse"
      version: v13.2-dev
      icon: fa-solid fa-otter
      desc: "Berichte zu Abfragen, Last und Fehlern aus PostgreSQL- und PgBouncer-Protokollen."
      url: /pgbadger/
      shortcuts_label: "Schnellzugriffe auf die pgBadger-Dokumentation"
      shortcuts:
        - { title: "PostgreSQL-Protokollierung", url: /pgbadger/postgresql-logging/, icon: fa-solid fa-file-lines }
        - { title: "Befehlszeile", url: /pgbadger/command-line/, icon: fa-solid fa-terminal }
        - { title: "Inkrementelle Berichte", url: /pgbadger/incremental-reports/, icon: fa-solid fa-calendar-days }
        - { title: "Beispielberichte", url: /pgbadger/sample-reports/, icon: fa-solid fa-chart-column }
    - title: "HAProxy"
      meta: "Lastverteilung"
      version: v3.4
      icon: fa-solid fa-network-wired
      desc: "Die vollständigen HAProxy-3.4-Handbücher: Einstieg, Konfiguration und Verwaltung."
      url: /haproxy/
      shortcuts_label: "Schnellzugriffe auf die HAProxy-Dokumentation"
      shortcuts:
        - { title: "Einstiegsleitfaden", url: /haproxy/load-balancing/, icon: fa-solid fa-compass }
        - { title: "Konfigurationshandbuch", url: /haproxy/http-fundamentals/, icon: fa-solid fa-file-code }
        - { title: "Verwaltungsleitfaden", url: /haproxy/prerequisites/, icon: fa-solid fa-screwdriver-wrench }
        - { title: "ACLs und Samples", url: /haproxy/acls-and-samples/, icon: fa-solid fa-filter }
    - title: "etcd"
      meta: "Konsens und Koordination"
      version: v3.7.3
      icon: fa-solid fa-gear
      desc: "Ein stark konsistenter Schlüssel-Wert-Speicher: Betrieb, APIs, Raft-Modell und Interna."
      url: /etcd/
      shortcuts_label: "Schnellzugriffe auf die etcd-Dokumentation"
      shortcuts:
        - { title: "Schnellstart", url: /etcd/quickstart/, icon: fa-solid fa-bolt }
        - { title: "Installation", url: /etcd/install/, icon: fa-solid fa-download }
        - { title: "Konfiguration", url: /etcd/op-guide/configuration/, icon: fa-solid fa-sliders }
        - { title: "API", url: /etcd/learning/api/, icon: fa-solid fa-code }

about:
  title: "Über diese Website"
  items:
    - title: "Eine unabhängige Community-Ausgabe"
      text: "PG.CENTER wird von PGSTY gepflegt und ist keine offizielle PostgreSQL-Website. Jede Sammlung verlinkt ihr Originalprojekt und bewahrt dessen Quellenangaben und Lizenz."
      icon: fa-solid fa-people-group
      url: https://pg.center/
    - title: "Quellen und Lizenzen"
      text: "Jede Seite endet mit einer Zeile zu Originalwerk, Rechteinhaber und Lizenz. Die Seite zu Quellenangaben nennt die festgeschriebenen Upstream-Revisionen und die beibehaltenen Hinweise."
      icon: fa-solid fa-scale-balanced
      url: /attribution/
