# doc.pg.center home (ar): hero with the eight reading languages, the six
# manuals with their most-used pages, and two facts about the site. Partials
# live in layouts/_partials/pgsql/. Keep the eight language files in step.
sections:
  - { key: hero, partial: pgsql/hero-orbit.html }
  - { key: components, partial: pgsql/manuals.html }
  - { key: about, partial: pgsql/about.html }

hero:
  class: pgsql-hero pgsql-hero--fit-title
  title_lines:
    - words:
        - { mark: "P", color: "blue", text: "ostgreSQL" }
    - words:
        - { text: "توثيق المكوّنات" }
  lead: "أدلة ومراجع للأدوات التي تُبقي PostgreSQL يعمل في الإنتاج."
  note: "ستة مكوّنات، ثماني لغات. جزء من [pg.center](https://pg.center/)."
  note_icon: fa-solid fa-book-open
  languages_label: "لغة القراءة"
  orbit:
    center_image: img/slonik.svg

components:
  title: "مكونات المجتمع"
  items:
    - title: "Patroni"
      meta: "التوافر العالي"
      version: v4.1.5
      icon: fa-solid fa-heart-pulse
      desc: "شغّل عناقيد PostgreSQL عالية التوافر بتوافق موزّع وتجاوز تلقائي للأعطال."
      url: /patroni/
      shortcuts_label: "اختصارات توثيق Patroni"
      shortcuts:
        - { title: "التثبيت", url: /patroni/installation/, icon: fa-solid fa-download }
        - { title: "الإعداد", url: /patroni/config/, icon: fa-solid fa-sliders }
        - { title: "patronictl", url: /patroni/patronictl/, icon: fa-solid fa-terminal }
        - { title: "REST API", url: /patroni/rest_api/, icon: fa-solid fa-plug }
    - title: "pgBackRest"
      meta: "النسخ الاحتياطي والاستعادة"
      version: v2.60.0
      icon: fa-solid fa-couch
      desc: "صمّم مسارات موثوقة للنسخ الاحتياطي والاستعادة والأرشفة والاستعادة إلى نقطة زمنية."
      url: /pgbackrest/
      shortcuts_label: "اختصارات توثيق pgBackRest"
      shortcuts:
        - { title: "دليل المستخدم", url: /pgbackrest/user-guide/, icon: fa-solid fa-route }
        - { title: "الإعداد", url: /pgbackrest/configuration/, icon: fa-solid fa-sliders }
        - { title: "الأوامر", url: /pgbackrest/command/, icon: fa-solid fa-terminal }
        - { title: "الأسئلة الشائعة", url: /pgbackrest/faq/, icon: fa-solid fa-circle-question }
    - title: "PgBouncer"
      meta: "تجميع الاتصالات"
      version: v1.26.1
      icon: fa-solid fa-arrows-turn-to-dots
      desc: "اخفض كلفة اتصالات PostgreSQL بالتجميع على مستوى الجلسة أو المعاملة أو العبارة."
      url: /pgbouncer/
      shortcuts_label: "اختصارات توثيق PgBouncer"
      shortcuts:
        - { title: "التثبيت", url: /pgbouncer/install/, icon: fa-solid fa-wrench }
        - { title: "الاستخدام", url: /pgbouncer/usage/, icon: fa-solid fa-terminal }
        - { title: "الإعداد", url: /pgbouncer/config/, icon: fa-solid fa-sliders }
        - { title: "الأسئلة الشائعة", url: /pgbouncer/faq/, icon: fa-solid fa-circle-question }
    - title: "pgBadger"
      meta: "تحليل السجلات"
      version: v13.2-dev
      icon: fa-solid fa-otter
      desc: "حوّل سجلات PostgreSQL وPgBouncer إلى تقارير عن الاستعلامات وحِمل العمل والأخطاء."
      url: /pgbadger/
      shortcuts_label: "اختصارات توثيق pgBadger"
      shortcuts:
        - { title: "تسجيل PostgreSQL", url: /pgbadger/postgresql-logging/, icon: fa-solid fa-file-lines }
        - { title: "سطر الأوامر", url: /pgbadger/command-line/, icon: fa-solid fa-terminal }
        - { title: "التقارير التزايدية", url: /pgbadger/incremental-reports/, icon: fa-solid fa-calendar-days }
        - { title: "تقارير نموذجية", url: /pgbadger/sample-reports/, icon: fa-solid fa-chart-column }
    - title: "HAProxy"
      meta: "موازنة الحمل"
      version: v3.4
      icon: fa-solid fa-network-wired
      desc: "اقرأ أدلة HAProxy 3.4 الثلاثة كاملةً: دليل البدء ودليل الإعداد ودليل الإدارة."
      url: /haproxy/
      shortcuts_label: "اختصارات توثيق HAProxy"
      shortcuts:
        - { title: "دليل البدء", url: /haproxy/load-balancing/, icon: fa-solid fa-compass }
        - { title: "دليل الإعداد", url: /haproxy/http-fundamentals/, icon: fa-solid fa-file-code }
        - { title: "دليل الإدارة", url: /haproxy/prerequisites/, icon: fa-solid fa-screwdriver-wrench }
        - { title: "قوائم ACL والعيّنات", url: /haproxy/acls-and-samples/, icon: fa-solid fa-filter }
    - title: "etcd"
      meta: "التوافق والتنسيق"
      version: v3.7.3
      icon: fa-solid fa-gear
      desc: "شغّل مخزن مفاتيح–قيم متّسق بقوة، مع واجهاته البرمجية ونموذج Raft وبنيته الداخلية."
      url: /etcd/
      shortcuts_label: "اختصارات توثيق etcd"
      shortcuts:
        - { title: "الدليل السريع", url: /etcd/quickstart/, icon: fa-solid fa-bolt }
        - { title: "التثبيت", url: /etcd/install/, icon: fa-solid fa-download }
        - { title: "الإعداد", url: /etcd/op-guide/configuration/, icon: fa-solid fa-sliders }
        - { title: "الواجهة البرمجية", url: /etcd/learning/api/, icon: fa-solid fa-code }

about:
  title: "عن هذا الموقع"
  items:
    - title: "نسخة مجتمعية مستقلة"
      text: "تحافظ PGSTY على PG.CENTER، وهو ليس موقعًا رسميًا لـ PostgreSQL. ترتبط كل مجموعة بمشروعها الأصلي وتحفظ إسناده وترخيصه."
      icon: fa-solid fa-people-group
      url: https://pg.center/
    - title: "المصادر والتراخيص"
      text: "تنتهي كل صفحة بسطر يذكر العمل المُعدَّل منه وصاحب حقوقه وترخيصه، وتجمع صفحة الإسناد المراجعات الأصلية المثبّتة والإشعارات المحفوظة."
      icon: fa-solid fa-scale-balanced
      url: /attribution/
