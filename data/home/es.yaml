# doc.pg.center home (es): hero with the eight reading languages, the six
# manuals with their most-used pages, and two facts about the site. Partials
# live in layouts/_partials/pgsql/. Keep the eight language files in step.
sections:
  - { key: hero, partial: pgsql/hero-orbit.html }
  - { key: components, partial: pgsql/manuals.html }
  - { key: about, partial: pgsql/about.html }

hero:
  class: pgsql-hero pgsql-hero--fit-title
  title_lines:
    - words:
        - { mark: "P", color: "blue", text: "ostgreSQL" }
    - words:
        - { text: "Documentación de componentes" }
  lead: "Guías y referencias de las herramientas que mantienen PostgreSQL en producción."
  note: "Seis componentes, ocho idiomas. Parte de [pg.center](https://pg.center/)."
  note_icon: fa-solid fa-book-open
  languages_label: "Leer en"
  orbit:
    center_image: img/slonik.svg

components:
  title: "Componentes de la comunidad"
  items:
    - title: "Patroni"
      meta: "Alta disponibilidad"
      version: v4.1.5
      icon: fa-solid fa-heart-pulse
      desc: "Clústeres de PostgreSQL con consenso distribuido y conmutación por error automática."
      url: /patroni/
      shortcuts_label: "Atajos de la documentación de Patroni"
      shortcuts:
        - { title: "Instalación", url: /patroni/installation/, icon: fa-solid fa-download }
        - { title: "Configuración", url: /patroni/config/, icon: fa-solid fa-sliders }
        - { title: "patronictl", url: /patroni/patronictl/, icon: fa-solid fa-terminal }
        - { title: "API REST", url: /patroni/rest_api/, icon: fa-solid fa-plug }
    - title: "pgBackRest"
      meta: "Copia de seguridad y recuperación"
      version: v2.60.0
      icon: fa-solid fa-couch
      desc: "Copias de seguridad, restauración y archivado fiables, y recuperación a un instante dado."
      url: /pgbackrest/
      shortcuts_label: "Atajos de la documentación de pgBackRest"
      shortcuts:
        - { title: "Guía de usuario", url: /pgbackrest/user-guide/, icon: fa-solid fa-route }
        - { title: "Configuración", url: /pgbackrest/configuration/, icon: fa-solid fa-sliders }
        - { title: "Comandos", url: /pgbackrest/command/, icon: fa-solid fa-terminal }
        - { title: "FAQ", url: /pgbackrest/faq/, icon: fa-solid fa-circle-question }
    - title: "PgBouncer"
      meta: "Pool de conexiones"
      version: v1.26.1
      icon: fa-solid fa-arrows-turn-to-dots
      desc: "Reduce el coste de las conexiones con pooling a nivel de sesión, transacción y sentencia."
      url: /pgbouncer/
      shortcuts_label: "Atajos de la documentación de PgBouncer"
      shortcuts:
        - { title: "Instalación", url: /pgbouncer/install/, icon: fa-solid fa-wrench }
        - { title: "Uso", url: /pgbouncer/usage/, icon: fa-solid fa-terminal }
        - { title: "Configuración", url: /pgbouncer/config/, icon: fa-solid fa-sliders }
        - { title: "FAQ", url: /pgbouncer/faq/, icon: fa-solid fa-circle-question }
    - title: "pgBadger"
      meta: "Análisis de registros"
      version: v13.2-dev
      icon: fa-solid fa-otter
      desc: "Informes de consultas, carga y errores a partir de registros de PostgreSQL y PgBouncer."
      url: /pgbadger/
      shortcuts_label: "Atajos de la documentación de pgBadger"
      shortcuts:
        - { title: "Registro de PostgreSQL", url: /pgbadger/postgresql-logging/, icon: fa-solid fa-file-lines }
        - { title: "Línea de comandos", url: /pgbadger/command-line/, icon: fa-solid fa-terminal }
        - { title: "Informes incrementales", url: /pgbadger/incremental-reports/, icon: fa-solid fa-calendar-days }
        - { title: "Informes de ejemplo", url: /pgbadger/sample-reports/, icon: fa-solid fa-chart-column }
    - title: "HAProxy"
      meta: "Balanceo de carga"
      version: v3.4
      icon: fa-solid fa-network-wired
      desc: "Consulta los manuales completos de HAProxy 3.4: iniciación, configuración y gestión."
      url: /haproxy/
      shortcuts_label: "Atajos de la documentación de HAProxy"
      shortcuts:
        - { title: "Guía de inicio", url: /haproxy/load-balancing/, icon: fa-solid fa-compass }
        - { title: "Manual de configuración", url: /haproxy/http-fundamentals/, icon: fa-solid fa-file-code }
        - { title: "Manual de gestión", url: /haproxy/prerequisites/, icon: fa-solid fa-screwdriver-wrench }
        - { title: "ACL y muestras", url: /haproxy/acls-and-samples/, icon: fa-solid fa-filter }
    - title: "etcd"
      meta: "Consenso y coordinación"
      version: v3.7.3
      icon: fa-solid fa-gear
      desc: "Opera un almacén clave-valor consistente, con sus API, su modelo Raft y su diseño interno."
      url: /etcd/
      shortcuts_label: "Atajos de la documentación de etcd"
      shortcuts:
        - { title: "Guía rápida", url: /etcd/quickstart/, icon: fa-solid fa-bolt }
        - { title: "Instalación", url: /etcd/install/, icon: fa-solid fa-download }
        - { title: "Configuración", url: /etcd/op-guide/configuration/, icon: fa-solid fa-sliders }
        - { title: "API", url: /etcd/learning/api/, icon: fa-solid fa-code }

about:
  title: "Acerca de este sitio"
  items:
    - title: "Una edición comunitaria independiente"
      text: "PG.CENTER lo mantiene PGSTY y no es un sitio oficial de PostgreSQL. Cada colección enlaza con su proyecto original y conserva su atribución y su licencia."
      icon: fa-solid fa-people-group
      url: https://pg.center/
    - title: "Fuentes y licencias"
      text: "Cada página termina con una línea que indica la obra de origen, su titular de derechos y su licencia. La página de atribución recopila las revisiones de origen fijadas y los avisos conservados."
      icon: fa-solid fa-scale-balanced
      url: /attribution/
