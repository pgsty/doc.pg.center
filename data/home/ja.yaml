# doc.pg.center home (ja): hero with the eight reading languages, the six
# manuals with their most-used pages, and two facts about the site. Partials
# live in layouts/_partials/pgsql/. Keep the eight language files in step.
sections:
  - { key: hero, partial: pgsql/hero-orbit.html }
  - { key: components, partial: pgsql/manuals.html }
  - { key: about, partial: pgsql/about.html }

hero:
  class: pgsql-hero pgsql-hero--fit-title
  title_lines:
    - words:
        - { mark: "P", color: "blue", text: "ostgreSQL" }
    - words:
        - { text: "周辺ツールのドキュメント" }
  lead: "PostgreSQL の本番運用を支えるツールのガイドとリファレンス。"
  note: "6つのコンポーネント、8つの言語。[pg.center](https://pg.center/) のドキュメントサイトです。"
  note_icon: fa-solid fa-book-open
  languages_label: "表示言語"
  orbit:
    center_image: img/slonik.svg

components:
  title: "コミュニティコンポーネント"
  items:
    - title: "Patroni"
      meta: "高可用性"
      version: v4.1.5
      icon: fa-solid fa-heart-pulse
      desc: "分散コンセンサスと自動フェイルオーバーを備えた PostgreSQL クラスターを運用します。"
      url: /patroni/
      shortcuts_label: "Patroni ドキュメントへのショートカット"
      shortcuts:
        - { title: "インストール", url: /patroni/installation/, icon: fa-solid fa-download }
        - { title: "設定", url: /patroni/config/, icon: fa-solid fa-sliders }
        - { title: "patronictl", url: /patroni/patronictl/, icon: fa-solid fa-terminal }
        - { title: "REST API", url: /patroni/rest_api/, icon: fa-solid fa-plug }
    - title: "pgBackRest"
      meta: "バックアップとリカバリー"
      version: v2.60.0
      icon: fa-solid fa-couch
      desc: "信頼性の高いバックアップ、リストア、アーカイブ、ポイントインタイムリカバリーを設計します。"
      url: /pgbackrest/
      shortcuts_label: "pgBackRest ドキュメントへのショートカット"
      shortcuts:
        - { title: "ユーザーガイド", url: /pgbackrest/user-guide/, icon: fa-solid fa-route }
        - { title: "設定", url: /pgbackrest/configuration/, icon: fa-solid fa-sliders }
        - { title: "コマンド", url: /pgbackrest/command/, icon: fa-solid fa-terminal }
        - { title: "FAQ", url: /pgbackrest/faq/, icon: fa-solid fa-circle-question }
    - title: "PgBouncer"
      meta: "コネクションプーリング"
      version: v1.26.1
      icon: fa-solid fa-arrows-turn-to-dots
      desc: "セッション、トランザクション、ステートメントの各プーリングで接続オーバーヘッドを削減します。"
      url: /pgbouncer/
      shortcuts_label: "PgBouncer ドキュメントへのショートカット"
      shortcuts:
        - { title: "インストール", url: /pgbouncer/install/, icon: fa-solid fa-wrench }
        - { title: "使用方法", url: /pgbouncer/usage/, icon: fa-solid fa-terminal }
        - { title: "設定", url: /pgbouncer/config/, icon: fa-solid fa-sliders }
        - { title: "FAQ", url: /pgbouncer/faq/, icon: fa-solid fa-circle-question }
    - title: "pgBadger"
      meta: "ログ解析"
      version: v13.2-dev
      icon: fa-solid fa-otter
      desc: "PostgreSQL と PgBouncer のログから、クエリー、ワークロード、エラーのレポートを生成します。"
      url: /pgbadger/
      shortcuts_label: "pgBadger ドキュメントへのショートカット"
      shortcuts:
        - { title: "PostgreSQL ログ", url: /pgbadger/postgresql-logging/, icon: fa-solid fa-file-lines }
        - { title: "コマンドライン", url: /pgbadger/command-line/, icon: fa-solid fa-terminal }
        - { title: "増分レポート", url: /pgbadger/incremental-reports/, icon: fa-solid fa-calendar-days }
        - { title: "サンプルレポート", url: /pgbadger/sample-reports/, icon: fa-solid fa-chart-column }
    - title: "HAProxy"
      meta: "負荷分散"
      version: v3.4
      icon: fa-solid fa-network-wired
      desc: "HAProxy 3.4 の入門、設定、管理マニュアルをすべて参照できます。"
      url: /haproxy/
      shortcuts_label: "HAProxy ドキュメントへのショートカット"
      shortcuts:
        - { title: "入門ガイド", url: /haproxy/load-balancing/, icon: fa-solid fa-compass }
        - { title: "設定マニュアル", url: /haproxy/http-fundamentals/, icon: fa-solid fa-file-code }
        - { title: "管理ガイド", url: /haproxy/prerequisites/, icon: fa-solid fa-screwdriver-wrench }
        - { title: "ACL とサンプル", url: /haproxy/acls-and-samples/, icon: fa-solid fa-filter }
    - title: "etcd"
      meta: "コンセンサスと協調"
      version: v3.7.3
      icon: fa-solid fa-gear
      desc: "強い整合性を持つキー・バリューストア、その API、Raft モデル、内部構造を運用します。"
      url: /etcd/
      shortcuts_label: "etcd ドキュメントへのショートカット"
      shortcuts:
        - { title: "クイックスタート", url: /etcd/quickstart/, icon: fa-solid fa-bolt }
        - { title: "インストール", url: /etcd/install/, icon: fa-solid fa-download }
        - { title: "設定", url: /etcd/op-guide/configuration/, icon: fa-solid fa-sliders }
        - { title: "API", url: /etcd/learning/api/, icon: fa-solid fa-code }

about:
  title: "このサイトについて"
  items:
    - title: "独立したコミュニティ版"
      text: "PG.CENTER は PGSTY が管理しており、PostgreSQL の公式サイトではありません。各ドキュメントは元のプロジェクトにリンクし、帰属表示とライセンスを保持しています。"
      icon: fa-solid fa-people-group
      url: https://pg.center/
    - title: "出典とライセンス"
      text: "各ページの末尾に、改変元の著作物、著作権者、ライセンスを記載しています。帰属ページには、固定したアップストリームのリビジョンと保持している通知をまとめています。"
      icon: fa-solid fa-scale-balanced
      url: /attribution/
