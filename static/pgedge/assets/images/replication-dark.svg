<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 310" role="img" aria-labelledby="title desc"><title id="title">Spock replication</title><desc id="desc">Two PostgreSQL read-write nodes connected by asynchronous logical replication.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#53d8d4" stroke-width="1.5"/></marker></defs><rect x="8" y="8" width="464" height="294" rx="24" fill="#142a31"/><g fill="none" stroke="#31535a" stroke-width="1"><path d="M35 76H445 M35 234H445 M115 35V275 M365 35V275" stroke-dasharray="3 7"/></g><g fill="#1a343c" stroke="#31535a"><rect x="37" y="105" width="134" height="106" rx="14"/><rect x="309" y="105" width="134" height="106" rx="14"/></g><g fill="#e6f4f4" font-family="system-ui,sans-serif" font-size="27" font-weight="650" text-anchor="middle"><text x="104" y="151">n1</text><text x="376" y="151">n2</text></g><g fill="#a4c3c9" font-family="system-ui,sans-serif" font-size="12" text-anchor="middle"><text x="104" y="180">READ / WRITE</text><text x="376" y="180">READ / WRITE</text><text x="240" y="69">POSTGRESQL</text><text x="240" y="257">ASYNCHRONOUS REPLICATION</text></g><g fill="none" stroke="#53d8d4" stroke-width="2.5" marker-end="url(#arrow)"><path d="M183 144H293"/><path d="M297 174H187"/></g><rect x="199" y="91" width="82" height="29" rx="14" fill="#1a343c" stroke="#31535a"/><text x="240" y="110" fill="#e6f4f4" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="650">Spock</text></svg>