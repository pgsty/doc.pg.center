baseURL: https://pgsql.cc/
title: PGSQL.CC
enableRobotsTXT: true
enableGitInfo: true
enableEmoji: true
defaultContentLanguage: en

outputs:
  home: [HTML, RSS, markdown, LLMS]
  page: [HTML, markdown]
  section: [HTML, RSS, print, markdown]

markup:
  tableOfContents:
    endLevel: 4
  goldmark:
    parser:
      wrapStandAloneImageWithinParagraph: false
      attribute:
        block: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block: [['\[', '\]'], ['$$', '$$']]
          inline: [['\(', '\)']]
    renderer:
      unsafe: true
  highlight:
    noClasses: false

languages:
  en:
    label: English
    locale: en-US
    weight: 1
    title: PGSQL.CC
    params:
      description: Practical documentation for the tools that run PostgreSQL in production.
      ui:
        command_palette:
          commands:
            - id: attribution
              title: Attribution and licensing
              description: Sources, pinned revisions, and licences for every collection
              url: /attribution/
              icon: fa-solid fa-copyright
              keywords: [licence, license, copyright, upstream, credit, notice]
    menus:
      main:
        - identifier: patroni
          name: Patroni
          pageRef: /patroni
          weight: 10
          params:
            icon: fa-solid fa-heart-pulse
            description: PostgreSQL high availability and automatic failover
        - identifier: pgbackrest
          name: pgBackRest
          pageRef: /pgbackrest
          weight: 20
          params:
            icon: fa-solid fa-couch
            description: Reliable backup, restore, and archive management
        - identifier: pgbouncer
          name: PgBouncer
          pageRef: /pgbouncer
          weight: 30
          params:
            icon: fa-solid fa-arrows-turn-to-dots
            description: Lightweight connection pooling for PostgreSQL
        - identifier: pgbadger
          name: pgBadger
          pageRef: /pgbadger
          weight: 40
          params:
            icon: fa-solid fa-otter
            description: Fast PostgreSQL and PgBouncer log analysis
        - identifier: haproxy
          name: HAProxy
          pageRef: /haproxy
          weight: 50
          params:
            icon: fa-solid fa-network-wired
            description: Complete HAProxy 3.4 manuals
        - identifier: etcd
          name: etcd
          pageRef: /etcd
          weight: 60
          params:
            icon: fa-solid fa-gear
            description: Distributed key-value store operations and APIs

  zh:
    label: 简体中文
    locale: zh-CN
    weight: 2
    title: PGSQL.CC
    params:
      description: 面向生产实践的 PostgreSQL 生态工具中文文档。
      time_format_default: 2006年1月2日
      ui:
        share: [weibo, x, telegram, linkedin, email, copy]
        command_palette:
          commands:
            - id: attribution
              title: 归属与授权说明
              description: 各文档集的来源、固定版本与授权协议
              url: /zh/attribution/
              icon: fa-solid fa-copyright
              keywords: [授权, 版权, 协议, 上游, 归属, 声明]
    menus:
      main:
        - identifier: patroni
          name: Patroni
          pageRef: /patroni
          weight: 10
          params:
            icon: fa-solid fa-heart-pulse
            description: PostgreSQL 高可用与自动故障转移
        - identifier: pgbackrest
          name: pgBackRest
          pageRef: /pgbackrest
          weight: 20
          params:
            icon: fa-solid fa-couch
            description: 可靠的备份、恢复与归档管理
        - identifier: pgbouncer
          name: PgBouncer
          pageRef: /pgbouncer
          weight: 30
          params:
            icon: fa-solid fa-arrows-turn-to-dots
            description: 轻量级 PostgreSQL 连接池
        - identifier: pgbadger
          name: pgBadger
          pageRef: /pgbadger
          weight: 40
          params:
            icon: fa-solid fa-otter
            description: 快速分析 PostgreSQL 与 PgBouncer 日志
        - identifier: haproxy
          name: HAProxy
          url: ../haproxy/
          weight: 50
          params:
            icon: fa-solid fa-network-wired
            description: HAProxy 3.4 三套完整手册 · 英文原版
        - identifier: etcd
          name: etcd
          url: ../etcd/
          weight: 60
          params:
            icon: fa-solid fa-gear
            description: etcd 3.7 运维、API 与内部原理 · 英文原版

params:
  logo: favicon-512x512.png
  productionURL: https://pgsql.cc
  github_repo: https://github.com/pgsty/pgsql.cc
  github_branch: main
  description: Practical documentation for the PostgreSQL community stack.
  version: v1
  copyright:
    authors: '[PostgreSQL Community Components](https://pgsql.cc/)'
    from_year: 2026
    to_year: present
  footer_center_info: 'Built with [OINK](https://oink.pgsty.com/)'
  time_format_default: January 2, 2006
  offline_search: true
  offline_search_index: summary
  offline_search_summary_length: 80
  offline_search_max_results: 12
  page_width: normal
  # Giscus, backed by GitHub Discussions on the site repository. `pathname`
  # mapping gives each page its own thread, which also means the English and
  # Chinese versions of a page keep separate threads -- readers comment in the
  # language they are reading. Announcements is the category giscus recommends:
  # only maintainers may open threads there, so no stray discussion can claim a
  # page's slot. `strict` matches the thread by a hash of the pathname instead
  # of a fuzzy title search.
  comments:
    enable: true
    type: giscus
    giscus:
      repo: pgsty/pgsql.cc
      repoId: R_kgDOT5P-Ag
      category: Announcements
      categoryId: DIC_kwDOT5P-As4DD3wq
      mapping: pathname
      strict: 1
      reactionsEnabled: 1
      emitMetadata: 0
      inputPosition: top
      theme: auto
      loading: lazy
  ui:
    typography: technical
    quick_links: [patroni, pgbackrest, pgbouncer, pgbadger, haproxy, etcd]
    translation_notice: en
    section_index: cards
    dark_mode: true
    sidebar_icon_policy: all
    sidebar_menu_compact: true
    sidebar_menu_foldable: true
    sidebar_root_enabled: true
    sidebar_root_menu: true
    sidebar_headings: 3
    sidebar_expand_levels: 2
    landing_search: true
    page_context_menu:
      enable: true
      assistant_links: true
    image_zoom: true
    feedback:
      enable: false
    reading_time: false
    share: [x, bluesky, reddit, hackernews, linkedin, telegram, email, copy]

# Google Analytics 4. OINK gates the tag on `hugo.IsProduction`, so `hugo
# server` (development by default) serves no tag and no request to Google,
# while `hugo` and the CI deploy (production by default) both emit it.
services:
  googleAnalytics:
    ID: G-D9E4B60JWX

taxonomies:
  tag: tags
  category: categories

module:
  imports:
    - path: github.com/pgsty/oink
  hugoVersion:
    extended: true
    min: 0.160.1
