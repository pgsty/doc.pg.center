params:
  logo: img/slonik.svg
  productionURL: https://doc.pg.center
  github_repo: https://github.com/pgsty/doc.pg.center
  github_branch: main
  description: The component documentation site of pg.center, in six languages.
  version: v1
  copyright:
    authors: '[PG.CENTER](https://pg.center/)'
    from_year: 2026
    to_year: present
  footer_center_info: 'Built with [OINK](https://oink.pgsty.com/)'
  time_format_default: January 2, 2006
  offline_search: true
  offline_search_index: summary
  offline_search_summary_length: 80
  offline_search_max_results: 12
  page_width: normal
  # Giscus, backed by GitHub Discussions on the site repository. `pathname`
  # mapping gives each page its own thread, which also means every language
  # version of a page keeps a separate thread -- readers comment in the language
  # they are reading. Announcements is the category giscus recommends:
  # only maintainers may open threads there, so no stray discussion can claim a
  # page's slot. `strict` matches the thread by a hash of the pathname instead
  # of a fuzzy title search.
  comments:
    enable: true
    type: giscus
    giscus:
      repo: pgsty/doc.pg.center
      repoId: R_kgDOVIp3PA
      category: Announcements
      categoryId: DIC_kwDOVIp3PM4DIXzY
      mapping: pathname
      strict: 1
      reactionsEnabled: 1
      emitMetadata: 0
      inputPosition: top
      theme: auto
      loading: lazy
  ui:
    preset: paper
    preset_menu: [paper, slate, ink, terminal]
    typography: technical
    theme_color: '#336791'
    quick_links: [patroni, pgbackrest, pgbouncer, pgbadger, haproxy, etcd]
    translation_notice: false
    section_index: cards
    backlinks: true
    dark_mode: true
    sidebar_icon_policy: all
    sidebar_menu_compact: true
    sidebar_menu_foldable: true
    sidebar_root_enabled: true
    sidebar_root_menu: true
    sidebar_headings: 3
    sidebar_expand_levels: 2
    landing_search: true
    page_context_menu:
      enable: true
      assistant_links: true
    image_zoom: true
    feedback:
      enable: false
    reading_time: false
    share: [x, bluesky, reddit, hackernews, linkedin, telegram, email, copy]

# Shared with pg.center: Google Analytics 4 property G-D9E4B60JWX.
# OINK gates the tag on `hugo.IsProduction`, so `hugo
# server` (development by default) serves no tag and no request to Google,
# while `hugo` and the CI deploy (production by default) both emit it.
services:
  googleAnalytics:
    ID: G-D9E4B60JWX

taxonomies:
  tag: tags
  category: categories

module:
  imports:
    - path: github.com/pgsty/oink
  hugoVersion:
    extended: true
    min: 0.166.0
