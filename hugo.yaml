baseURL: https://doc.pg.center/
title: PG.CENTER
enableRobotsTXT: true
enableGitInfo: true
enableEmoji: true
defaultContentLanguage: en

outputs:
  home: [HTML, RSS, markdown, LLMS, NAVJSON]
  page: [HTML, markdown]
  section: [HTML, RSS, print, markdown]

markup:
  tableOfContents:
    endLevel: 4
  goldmark:
    parser:
      wrapStandAloneImageWithinParagraph: false
      attribute:
        block: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block: [['\[', '\]'], ['$$', '$$']]
          inline: [['\(', '\)']]
    renderer:
      unsafe: true
  highlight:
    noClasses: false

languages:
  en:
    label: English
    locale: en-US
    weight: 1
    title: PG.CENTER
    params:
      description: "The pg.center documentation site for Patroni, pgBackRest, PgBouncer, pgBadger, HAProxy, and etcd, in six languages."
      ui:
        command_palette:
          commands:
            - id: attribution
              title: Attribution and licensing
              description: Sources, pinned revisions, and licences for every collection
              url: /attribution/
              icon: fa-solid fa-copyright
              keywords: [licence, license, copyright, upstream, credit, notice]
    menus:
      main:
        - identifier: home
          name: Home
          url: https://pg.center/
          weight: 1
          params:
            icon: fa-solid fa-house
            description: PostgreSQL documentation and ecosystem resources
            new_tab: false
        - identifier: patroni
