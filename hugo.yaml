baseURL: https://pgsql.cc/
title: PGSQL.CC
enableRobotsTXT: true
enableGitInfo: false
enableEmoji: true
defaultContentLanguage: en

outputs:
  home: [HTML, RSS, markdown, LLMS]
  page: [HTML, markdown]
  section: [HTML, RSS, print, markdown]

markup:
  tableOfContents:
    endLevel: 4
  goldmark:
    parser:
      attribute:
        block: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block: [['\[', '\]'], ['$$', '$$']]
          inline: [['\(', '\)']]
    renderer:
      unsafe: true
  highlight:
    noClasses: false

languages:
  en:
    label: English
    locale: en-US
    weight: 1
    title: PGSQL.CC
    params:
      description: Practical documentation for the tools that run PostgreSQL in production.
      ui:
        command_palette:
          commands:
            - id: patroni_docs
              title: Open Patroni documentation
              description: High availability, configuration, and operations
              url: /docs/patroni/
              icon: fa-solid fa-heart-pulse
              keywords: [ha, failover, dcs, patronictl]
            - id: pgbackrest_docs
              title: Open pgBackRest documentation
              description: Backup, restore, archive, and command reference
              url: /docs/pgbackrest/
              icon: fa-solid fa-box-archive
              keywords: [backup, restore, wal, pitr]
            - id: pgbouncer_docs
              title: Open PgBouncer documentation
              description: Connection pooling, configuration, and usage
              url: /docs/pgbouncer/
              icon: fa-solid fa-diagram-project
              keywords: [pool, connection, session, transaction]
            - id: pgbadger_docs
              title: Open pgBadger documentation
              description: Log analysis, reports, and command reference
              url: /docs/pgbadger/
              icon: fa-solid fa-chart-line
              keywords: [log, analyzer, report, performance, pgbadger]
    menus:
      main:
        - identifier: patroni
          name: Patroni
          pageRef: /docs/patroni
          weight: 10
          params:
            icon: fa-solid fa-heart-pulse
            description: PostgreSQL high availability and automatic failover
        - identifier: pgbackrest
          name: pgBackRest
          pageRef: /docs/pgbackrest
          weight: 20
          params:
            icon: fa-solid fa-box-archive
            description: Reliable backup, restore, and archive management
        - identifier: pgbouncer
          name: PgBouncer
          pageRef: /docs/pgbouncer
          weight: 30
          params:
            icon: fa-solid fa-diagram-project
            description: Lightweight connection pooling for PostgreSQL
        - identifier: pgbadger
          name: pgBadger
          pageRef: /docs/pgbadger
          weight: 40
          params:
            icon: fa-solid fa-chart-line
            description: Fast PostgreSQL and PgBouncer log analysis

  zh:
    label: 简体中文
    locale: zh-CN
    weight: 2
    title: PGSQL.CC
    params:
      description: 面向生产实践的 PostgreSQL 生态工具中文文档。
      time_format_blog: 2006年1月2日
      time_format_default: 2006年1月2日
      links:
        user:
          - name: Patroni
            url: /zh/docs/patroni/
            icon: fa-solid fa-heart-pulse
            desc: PostgreSQL 高可用
          - name: pgBackRest
            url: /zh/docs/pgbackrest/
            icon: fa-solid fa-box-archive
            desc: 备份与恢复
          - name: PgBouncer
            url: /zh/docs/pgbouncer/
            icon: fa-solid fa-diagram-project
            desc: 连接池
          - name: pgBadger
            url: /zh/docs/pgbadger/
            icon: fa-solid fa-chart-line
            desc: 日志分析
      ui:
        command_palette:
          commands:
            - id: patroni_docs
              title: 打开 Patroni 文档
              description: 高可用、配置与日常运维
              url: /zh/docs/patroni/
              icon: fa-solid fa-heart-pulse
              keywords: [高可用, 故障转移, dcs, patronictl]
            - id: pgbackrest_docs
              title: 打开 pgBackRest 文档
              description: 备份、恢复、归档与命令参考
              url: /zh/docs/pgbackrest/
              icon: fa-solid fa-box-archive
              keywords: [备份, 恢复, wal, pitr]
            - id: pgbouncer_docs
              title: 打开 PgBouncer 文档
              description: 连接池、配置与使用方法
              url: /zh/docs/pgbouncer/
              icon: fa-solid fa-diagram-project
              keywords: [连接池, 连接, 会话, 事务]
            - id: pgbadger_docs
              title: 打开 pgBadger 文档
              description: 日志分析、报告与命令参考
              url: /zh/docs/pgbadger/
              icon: fa-solid fa-chart-line
              keywords: [日志, 分析, 报告, 性能, pgbadger]
    menus:
      main:
        - identifier: patroni
          name: Patroni
          pageRef: /docs/patroni
          weight: 10
          params:
            icon: fa-solid fa-heart-pulse
            description: PostgreSQL 高可用与自动故障转移
        - identifier: pgbackrest
          name: pgBackRest
          pageRef: /docs/pgbackrest
          weight: 20
          params:
            icon: fa-solid fa-box-archive
            description: 可靠的备份、恢复与归档管理
        - identifier: pgbouncer
          name: PgBouncer
          pageRef: /docs/pgbouncer
          weight: 30
          params:
            icon: fa-solid fa-diagram-project
            description: 轻量级 PostgreSQL 连接池
        - identifier: pgbadger
          name: pgBadger
          pageRef: /docs/pgbadger
          weight: 40
          params:
            icon: fa-solid fa-chart-line
            description: 快速分析 PostgreSQL 与 PgBouncer 日志

params:
  logo: favicon-512x512.png
  productionURL: https://pgsql.cc
  description: Practical documentation for the PostgreSQL community stack.
  version: v1
  copyright:
    authors: '[PostgreSQL Community Components](https://pgsql.cc/)'
    from_year: 2026
    to_year: present
  footer_center_info: 'Built with [OINK](https://oink.pgsty.com/)'
  time_format_blog: January 2, 2006
  time_format_default: January 2, 2006
  rss_sections: [blog]
  offlineSearch: true
  offlineSearchIndex: summary
  offlineSearchSummaryLength: 80
  offlineSearchMaxResults: 12
  prism_syntax_highlighting: false
  page_width: normal
  comments:
    enable: false
  ui:
    typography:
      preset: technical
    quick_links: [patroni, pgbackrest, pgbouncer, pgbadger]
    section_index: cards
    showLightDarkModeMenu: true
    sidebar_icon_policy: all
    sidebar_menu_compact: true
    sidebar_menu_foldable: true
    sidebar_root_enabled: true
    sidebar_root_menu: true
    sidebar_headings: 3
    ul_show: 2
    landing_search: true
    page_context_menu:
      enable: true
      assistant_links: true
    image_zoom:
      enable: true
    feedback:
      enable: false
    readingtime:
      enable: true
  links:
    user:
      - name: Patroni
        url: /docs/patroni/
        icon: fa-solid fa-heart-pulse
        desc: PostgreSQL high availability
      - name: pgBackRest
        url: /docs/pgbackrest/
        icon: fa-solid fa-box-archive
        desc: Backup and recovery
      - name: PgBouncer
        url: /docs/pgbouncer/
        icon: fa-solid fa-diagram-project
        desc: Connection pooling
      - name: pgBadger
        url: /docs/pgbadger/
        icon: fa-solid fa-chart-line
        desc: Log analysis

taxonomies:
  tag: tags
  category: categories

module:
  imports:
    - path: github.com/pgsty/oink
  hugoVersion:
    extended: true
    min: 0.160.1
